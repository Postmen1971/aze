<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Schichtbuch Bandgalvanik</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #121824;
      --card-bg: #1e2638;
      --accent-red: #ff4d4d;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; font-size: 14px; }
    .container { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 12px; color: #ffffff; }

    .card { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; padding-bottom: 4px; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; }
    .card-title.red { border-bottom-color: var(--accent-red); }
    .card-title.green { border-bottom-color: var(--accent-green); }

    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; margin-bottom: 3px; }
    input, select, textarea { width: 100%; padding: 10px; background: #111827; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    textarea { resize: vertical; min-height: 55px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tab-container { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px 0; background: #1f2937; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
    
    .anlage-content { display: none; }
    .anlage-content.active { display: block; }

    .btn-submit { width: 100%; padding: 14px; background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }

    /* =========================================================
       PDF DESIGN (A4 Querformat: 1123px x 794px)
       ========================================================= */
    #pdf-container {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1123px;
      background: #ffffff;
      color: #1f2937;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .pdf-page {
      width: 1123px;
      height: 794px;
      padding: 30px;
      background: #ffffff;
      box-sizing: border-box;
      position: relative;
    }

    .pdf-header {
      background: #1e293b;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pdf-header h2 { font-size: 16pt; font-weight: bold; }
    .pdf-header .badge { background: #3b82f6; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11pt; font-weight: bold; }

    .pdf-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .pdf-meta-item label { font-size: 7.5pt; text-transform: uppercase; color: #64748b; font-weight: bold; display: block; }
    .pdf-meta-item div { font-size: 10pt; font-weight: 600; color: #0f172a; }

    /* 4 Anlagen nebeneinander auf einem Blatt */
    .pdf-anlagen-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .pdf-anlage-card {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 8.5pt;
    }

    .pdf-anlage-title {
      background: #0f172a;
      color: #ffffff;
      font-weight: bold;
      text-align: center;
      padding: 6px;
      font-size: 10pt;
    }

    .pdf-card-body { padding: 8px; flex: 1; display: flex; flex-direction: column; gap: 8px; }

    .pdf-block {
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      padding: 6px;
      border-radius: 4px;
    }

    .pdf-block-title {
      font-size: 7.5pt;
      font-weight: bold;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 3px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 2px;
    }

    .pdf-block-title.red { color: #dc2626; border-bottom-color: #fca5a5; }
    .pdf-block-title.green { color: #059669; border-bottom-color: #6ee7b7; }

    .pdf-val { font-size: 8.5pt; color: #1e293b; white-space: pre-wrap; word-break: break-word; }

    .pdf-footer {
      position: absolute;
      bottom: 15px;
      left: 30px;
      right: 30px;
      border-top: 1px solid #e2e8f0;
      padding-top: 6px;
      display: flex;
      justify-content: space-between;
      font-size: 7.5pt;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container" id="main-form">
  <h1>Schichtbuch Bandgalvanik</h1>

  <div class="card">
    <div class="card-title">Schichtdaten</div>
    <div class="grid-2">
      <div>
        <label for="datum">Datum</label>
        <input type="date" id="datum">
      </div>
      <div>
        <label for="schicht">Schicht</label>
        <select id="schicht">
          <option value="Frühschicht">Frühschicht</option>
          <option value="Spätschicht">Spätschicht</option>
          <option value="Nachtschicht">Nachtschicht</option>
        </select>
      </div>
    </div>
    <label for="bediener">Schichtführer / Bediener</label>
    <input type="text" id="bediener" placeholder="Name(n) eintragen">
  </div>

  <div class="tab-container">
    <button class="tab-btn active" onclick="showAnlage('801', event)">A 801</button>
    <button class="tab-btn" onclick="showAnlage('802', event)">A 802</button>
    <button class="tab-btn" onclick="showAnlage('803', event)">A 803</button>
    <button class="tab-btn" onclick="showAnlage('804', event)">A 804</button>
  </div>

  <form id="schichtForm">
    <script>
      const anlagen = ['801', '802', '803', '804'];
      anlagen.forEach((a, index) => {
        document.write(`
          <div id="anlage-${a}" class="anlage-content ${index === 0 ? 'active' : ''}">
            <div class="card">
              <div class="card-title red">Ausschuss - Anlage ${a}</div>
              <div class="grid-2">
                <div>
                  <label>Menge (m / Stk)</label>
                  <input type="text" id="ausschuss_menge_${a}" placeholder="0">
                </div>
                <div>
                  <label>Hauptursache</label>
                  <select id="ausschuss_grund_${a}">
                    <option value="Kein Ausschuss">Kein Ausschuss</option>
                    <option value="Schweißnaht gerissen">Schweißnaht gerissen</option>
                    <option value="Beschichtungsfehler">Beschichtungsfehler</option>
                    <option value="Bandstillstand">Bandstillstand</option>
                    <option value="Mechanischer Defekt">Mechanischer Defekt</option>
                    <option value="Reinigungsfehler / Flecken">Reinigungsfehler / Flecken</option>
                    <option value="Sonstiges">Sonstiges</option>
                  </select>
                </div>
              </div>
              <label>Ursache & Details zum Ausschuss</label>
              <textarea id="ausschuss_details_${a}" placeholder="Warum ist der Ausschuss entstanden?"></textarea>
            </div>

            <div class="card">
              <div class="card-title">Aufträge</div>
              <label>Aktueller Auftrag</label>
              <input type="text" id="auftrag_akt_${a}" placeholder="Teilenummer / Auftrag">
              <label>Bekannter Folgeauftrag</label>
              <input type="text" id="auftrag_folge_${a}" placeholder="Nächster Auftrag">
            </div>

            <div class="card">
              <div class="card-title green">To-Do für Folgeschicht</div>
              <textarea id="todo_${a}" placeholder="Was muss die nächste Schicht erledigen?"></textarea>
            </div>

            <div class="card">
              <div class="card-title">Stationen & Besonderheiten</div>
              <label>Auffälligkeiten an den Stationen</label>
              <textarea id="stationen_${a}" placeholder="Abwickeln, Schweißen, Hot Wash, US-Clean..."></textarea>
              <label>Defekte & technische Störungen</label>
              <textarea id="defekte_${a}" placeholder="Was war defekt?"></textarea>
              <label>Fehlendes Werkzeug / Materialien / KVP</label>
              <textarea id="material_${a}" placeholder="Bestellungen, fehlende Teile, Verbesserungen"></textarea>
            </div>
          </div>
        `);
      });
    </script>

    <button type="button" id="submitBtn" class="btn-submit" onclick="generateShiftPDF()">
      PDF Erstellen & Öffnen
    </button>
  </form>
</div>

<!-- DIESER CONTAINER ERZEUGT DAS DRUCKBLATT PRO SCHICHT -->
<div id="pdf-container"></div>

<script>
  document.getElementById('datum').valueAsDate = new Date();

  function showAnlage(anl, event) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.anlage-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`anlage-${anl}`).classList.add('active');
  }

  async function generateShiftPDF() {
    const btn = document.getElementById('submitBtn');
    btn.innerText = "Erstelle Schichtblatt...";
    btn.style.opacity = "0.5";

    const datumVal = document.getElementById('datum').value || '-';
    const schichtVal = document.getElementById('schicht').value;
    const bedienerVal = document.getElementById('bediener').value || '-';

    const pdfContainer = document.getElementById('pdf-container');
    pdfContainer.innerHTML = '';

    // HTML-Aufbau für genau 1 A4-Querformat-Blatt (enthält alle 4 Anlagen)
    let anlagenHTML = '';
    ['801', '802', '803', '804'].forEach(a => {
      const aMenge = document.getElementById(`ausschuss_menge_${a}`).value || '0';
      const aGrund = document.getElementById(`ausschuss_grund_${a}`).value;
      const aDet = document.getElementById(`ausschuss_details_${a}`).value || '-';
      const aktAuf = document.getElementById(`auftrag_akt_${a}`).value || '-';
      const folgAuf = document.getElementById(`auftrag_folge_${a}`).value || '-';
      const todo = document.getElementById(`todo_${a}`).value || '-';
      const stat = document.getElementById(`stationen_${a}`).value || '-';
      const def = document.getElementById(`defekte_${a}`).value || '-';
      const mat = document.getElementById(`material_${a}`).value || '-';

      anlagenHTML += `
        <div class="pdf-anlage-card">
          <div class="pdf-anlage-title">ANLAGE ${a}</div>
          <div class="pdf-card-body">
            
            <div class="pdf-block">
              <div class="pdf-block-title red">Ausschuss (${aMenge})</div>
              <div class="pdf-val"><b>Grund:</b> ${aGrund}</div>
              <div class="pdf-val"><b>Details:</b> ${aDet}</div>
            </div>

            <div class="pdf-block">
              <div class="pdf-block-title">Aufträge</div>
              <div class="pdf-val"><b>Aktuell:</b> ${aktAuf}</div>
              <div class="pdf-val"><b>Folge:</b> ${folgAuf}</div>
            </div>

            <div class="pdf-block">
              <div class="pdf-block-title green">To-Do Folgeschicht</div>
              <div class="pdf-val">${todo}</div>
            </div>

            <div class="pdf-block" style="flex: 1;">
              <div class="pdf-block-title">Stationen & Störungen</div>
              <div class="pdf-val"><b>Stationen:</b> ${stat}</div>
              <div class="pdf-val"><b>Defekte:</b> ${def}</div>
              <div class="pdf-val"><b>Material/KVP:</b> ${mat}</div>
            </div>

          </div>
        </div>
      `;
    });

    pdfContainer.innerHTML = `
      <div class="pdf-page" id="pdf-shift-page">
        <div class="pdf-header">
          <div>
            <h2>SCHICHTBUCH PROTOKOLL</h2>
            <div style="font-size: 9pt; opacity: 0.8;">Bandgalvanik Gesamtbericht</div>
          </div>
          <div class="badge">${schichtVal.toUpperCase()}</div>
        </div>

        <div class="pdf-meta-grid">
          <div class="pdf-meta-item">
            <label>Datum</label>
            <div>${datumVal}</div>
          </div>
          <div class="pdf-meta-item">
            <label>Schicht</label>
            <div>${schichtVal}</div>
          </div>
          <div class="pdf-meta-item">
            <label>Schichtführer / Bediener</label>
            <div>${bedienerVal}</div>
          </div>
        </div>

        <div class="pdf-anlagen-grid">
          ${anlagenHTML}
        </div>

        <div class="pdf-footer">
          <span>Schichtbuch Protokoll - Bandgalvanik</span>
          <span>1 Blatt pro Schicht</span>
        </div>
      </div>
    `;

    // Canvas & PDF Rendern (A4 Querformat)
    const pageEl = document.getElementById('pdf-shift-page');
    const canvas = await html2canvas(pageEl, {
      scale: 2,
      useCORS: true,
      logging: false
    });

    const imgData = canvas.toDataURL('image/jpeg', 0.98);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('landscape', 'pt', 'a4');

    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = pdf.internal.pageSize.getHeight();

    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);

    const pdfBlob = pdf.output('blob');
    const pdfUrl = URL.createObjectURL(pdfBlob);

    btn.innerText = "PDF Erstellen & Öffnen";
    btn.style.opacity = "1";

    // Direkt im Browser/iPhone anzeigen
    window.location.href = pdfUrl;
  }
</script>

</body>
</html>
