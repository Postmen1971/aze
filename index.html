<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Schichtbuch Bandgalvanik</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #121824;
      --card-bg: #1e2638;
      --accent-red: #ff4d4d;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; font-size: 14px; }
    .container { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 12px; color: #ffffff; }

    .card { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; padding-bottom: 4px; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; }
    .card-title.red { border-bottom-color: var(--accent-red); }
    .card-title.green { border-bottom-color: var(--accent-green); }

    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; margin-bottom: 3px; }
    input, select, textarea { width: 100%; padding: 10px; background: #111827; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    textarea { resize: vertical; min-height: 55px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tab-container { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px 0; background: #1f2937; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
    
    .anlage-content { display: none; }
    .anlage-content.active { display: block; }

    .btn-submit { width: 100%; padding: 14px; background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }

    /* =========================================================
       PROFI PDF DESIGN (Wird im Hintergrund für Rendering genutzt)
       ========================================================= */
    #pdf-container {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 794px; /* A4 Breite bei 96 DPI */
      background: #ffffff;
      color: #1f2937;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .pdf-page {
      width: 794px;
      height: 1123px; /* Exact A4 Höhe */
      padding: 40px;
      background: #ffffff;
      box-sizing: border-box;
      position: relative;
    }

    .pdf-header {
      background: #1e293b;
      color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pdf-header h2 { font-size: 18pt; font-weight: bold; letter-spacing: 0.5px; }
    .pdf-header .badge { background: #3b82f6; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12pt; font-weight: bold; }

    .pdf-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .pdf-meta-item label { font-size: 8pt; text-transform: uppercase; color: #64748b; font-weight: bold; margin: 0; }
    .pdf-meta-item div { font-size: 11pt; font-weight: 600; color: #0f172a; margin-top: 2px; }

    .pdf-section {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 18px;
      background: #ffffff;
    }

    .pdf-section-title {
      font-size: 11pt;
      font-weight: bold;
      color: #1e293b;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 6px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pdf-section-title.red { border-bottom-color: #ef4444; color: #dc2626; }
    .pdf-section-title.green { border-bottom-color: #10b981; color: #059669; }

    .pdf-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .pdf-text-box { background: #f8fafc; border: 1px solid #f1f5f9; padding: 10px; border-radius: 6px; font-size: 10pt; color: #334155; min-height: 40px; white-space: pre-wrap; }
    
    .pdf-footer {
      position: absolute;
      bottom: 30px;
      left: 40px;
      right: 40px;
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 8pt;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container" id="main-form">
  <h1>Schichtbuch Bandgalvanik</h1>

  <div class="card">
    <div class="card-title">Schichtdaten</div>
    <div class="grid-2">
      <div>
        <label for="datum">Datum</label>
        <input type="date" id="datum">
      </div>
      <div>
        <label for="schicht">Schicht</label>
        <select id="schicht">
          <option value="Frühschicht">Frühschicht</option>
          <option value="Spätschicht">Spätschicht</option>
          <option value="Nachtschicht">Nachtschicht</option>
        </select>
      </div>
    </div>
    <label for="bediener">Schichtführer / Bediener</label>
    <input type="text" id="bediener" placeholder="Name(n) eintragen">
  </div>

  <div class="tab-container">
    <button class="tab-btn active" onclick="showAnlage('801', event)">A 801</button>
    <button class="tab-btn" onclick="showAnlage('802', event)">A 802</button>
    <button class="tab-btn" onclick="showAnlage('803', event)">A 803</button>
    <button class="tab-btn" onclick="showAnlage('804', event)">A 804</button>
  </div>

  <form id="schichtForm">
    <script>
      const anlagen = ['801', '802', '803', '804'];
      anlagen.forEach((a, index) => {
        document.write(`
          <div id="anlage-${a}" class="anlage-content ${index === 0 ? 'active' : ''}">
            <div class="card">
              <div class="card-title red">Ausschuss - Anlage ${a}</div>
              <div class="grid-2">
                <div>
                  <label>Menge (m / Stk)</label>
                  <input type="text" id="ausschuss_menge_${a}" placeholder="0">
                </div>
                <div>
                  <label>Hauptursache</label>
                  <select id="ausschuss_grund_${a}">
                    <option value="Kein Ausschuss">Kein Ausschuss</option>
                    <option value="Schweißnaht gerissen">Schweißnaht gerissen</option>
                    <option value="Beschichtungsfehler">Beschichtungsfehler</option>
                    <option value="Bandstillstand">Bandstillstand</option>
                    <option value="Mechanischer Defekt">Mechanischer Defekt</option>
                    <option value="Reinigungsfehler / Flecken">Reinigungsfehler / Flecken</option>
                    <option value="Sonstiges">Sonstiges</option>
                  </select>
                </div>
              </div>
              <label>Ursache & Details zum Ausschuss</label>
              <textarea id="ausschuss_details_${a}" placeholder="Warum ist der Ausschuss entstanden?"></textarea>
            </div>

            <div class="card">
              <div class="card-title">Aufträge</div>
              <label>Aktueller Auftrag</label>
              <input type="text" id="auftrag_akt_${a}" placeholder="Teilenummer / Auftrag">
              <label>Bekannter Folgeauftrag</label>
              <input type="text" id="auftrag_folge_${a}" placeholder="Nächster Auftrag">
            </div>

            <div class="card">
              <div class="card-title green">To-Do für Folgeschicht</div>
              <textarea id="todo_${a}" placeholder="Was muss die nächste Schicht erledigen?"></textarea>
            </div>

            <div class="card">
              <div class="card-title">Stationen & Besonderheiten</div>
              <label>Auffälligkeiten an den Stationen</label>
              <textarea id="stationen_${a}" placeholder="Abwickeln, Schweißen, Hot Wash, US-Clean, E-Clean..."></textarea>
              <label>Defekte & technische Störungen</label>
              <textarea id="defekte_${a}" placeholder="Was war defekt?"></textarea>
              <label>Fehlendes Werkzeug / Materialien / KVP</label>
              <textarea id="material_${a}" placeholder="Bestellungen, fehlende Teile, Verbesserungen"></textarea>
            </div>
          </div>
        `);
      });
    </script>

    <button type="button" id="submitBtn" class="btn-submit" onclick="generateProPDF()">
      PDF Erstellen & Öffnen
    </button>
  </form>
</div>

<!-- DIESER CONTAINER BAUT DIE DRUCK-SEITEN AUF -->
<div id="pdf-container"></div>

<script>
  document.getElementById('datum').valueAsDate = new Date();

  function showAnlage(anl, event) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.anlage-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`anlage-${anl}`).classList.add('active');
  }

  // Prüft, ob eine Anlage tatsächlich beschrieben wurde
  function isAnlageUsed(a) {
    const menge = document.getElementById(`ausschuss_menge_${a}`).value.trim();
    const grund = document.getElementById(`ausschuss_grund_${a}`).value;
    const det = document.getElementById(`ausschuss_details_${a}`).value.trim();
    const akt = document.getElementById(`auftrag_akt_${a}`).value.trim();
    const folg = document.getElementById(`auftrag_folge_${a}`).value.trim();
    const todo = document.getElementById(`todo_${a}`).value.trim();
    const stat = document.getElementById(`stationen_${a}`).value.trim();
    const def = document.getElementById(`defekte_${a}`).value.trim();
    const mat = document.getElementById(`material_${a}`).value.trim();

    return (menge !== '' && menge !== '0') || grund !== 'Kein Ausschuss' || det !== '' || akt !== '' || folg !== '' || todo !== '' || stat !== '' || def !== '' || mat !== '';
  }

  async function generateProPDF() {
    const btn = document.getElementById('submitBtn');
    btn.innerText = "Erstelle edles PDF...";
    btn.style.opacity = "0.5";

    const datumVal = document.getElementById('datum').value || '-';
    const schichtVal = document.getElementById('schicht').value;
    const bedienerVal = document.getElementById('bediener').value || '-';

    const pdfContainer = document.getElementById('pdf-container');
    pdfContainer.innerHTML = '';

    // Welche Anlagen haben Daten?
    let activeAnlagen = ['801', '802', '803', '804'].filter(a => isAnlageUsed(a));
    
    // Falls gar nichts ausgefüllt wurde, drucken wir zumindest die erste Anlage
    if (activeAnlagen.length === 0) activeAnlagen = ['801'];

    // Seiten im HTML aufbauen (Jede Anlage bekommt genau 1 A4 Seite)
    activeAnlagen.forEach((a, index) => {
      const aMenge = document.getElementById(`ausschuss_menge_${a}`).value || '0';
      const aGrund = document.getElementById(`ausschuss_grund_${a}`).value;
      const aDet = document.getElementById(`ausschuss_details_${a}`).value || 'Keine Angabe';
      const aktAuf = document.getElementById(`auftrag_akt_${a}`).value || '-';
      const folgAuf = document.getElementById(`auftrag_folge_${a}`).value || '-';
      const todo = document.getElementById(`todo_${a}`).value || 'Keine Aufgaben';
      const stat = document.getElementById(`stationen_${a}`).value || 'Keine Auffälligkeiten';
      const def = document.getElementById(`defekte_${a}`).value || 'Keine Defekte';
      const mat = document.getElementById(`material_${a}`).value || 'Kein Materialbedarf';

      pdfContainer.innerHTML += `
        <div class="pdf-page" id="pdf-page-${index}">
          <div class="pdf-header">
            <div>
              <h2>SCHICHTBUCH PROTOKOLL</h2>
              <div style="font-size: 10pt; opacity: 0.8; margin-top: 2px;">Bandgalvanik Produktionsbericht</div>
            </div>
            <div class="badge">ANLAGE ${a}</div>
          </div>

          <div class="pdf-meta-grid">
            <div class="pdf-meta-item">
              <label>Datum</label>
              <div>${datumVal}</div>
            </div>
            <div class="pdf-meta-item">
              <label>Schicht</label>
              <div>${schichtVal}</div>
            </div>
            <div class="pdf-meta-item">
              <label>Schichtführer</label>
              <div>${bedienerVal}</div>
            </div>
          </div>

          <div class="pdf-section">
            <div class="pdf-section-title red">Ausschuss & Ursachen</div>
            <div class="pdf-grid-2" style="margin-bottom: 10px;">
              <div><strong style="font-size: 9pt; color: #64748b;">Menge:</strong> <span style="font-weight: bold; color: #dc2626;">${aMenge}</span></div>
              <div><strong style="font-size: 9pt; color: #64748b;">Hauptursache:</strong> <span>${aGrund}</span></div>
            </div>
            <strong style="font-size: 8pt; text-transform: uppercase; color: #64748b;">Details / Beschreibung:</strong>
            <div class="pdf-text-box" style="margin-top: 4px;">${aDet}</div>
          </div>

          <div class="pdf-section">
            <div class="pdf-section-title">Auftragsstatus</div>
            <div class="pdf-grid-2">
              <div>
                <strong style="font-size: 8pt; text-transform: uppercase; color: #64748b;">Aktueller Auftrag:</strong>
                <div class="pdf-text-box" style="margin-top: 4px;">${aktAuf}</div>
              </div>
              <div>
                <strong style="font-size: 8pt; text-transform: uppercase; color: #64748b;">Folgeauftrag:</strong>
                <div class="pdf-text-box" style="margin-top: 4px;">${folgAuf}</div>
              </div>
            </div>
          </div>

          <div class="pdf-section">
            <div class="pdf-section-title green">To-Do für Folgeschicht</div>
            <div class="pdf-text-box">${todo}</div>
          </div>

          <div class="pdf-section">
            <div class="pdf-section-title">Stationen, Defekte & KVP</div>
            <div style="margin-bottom: 8px;">
              <strong style="font-size: 8pt; text-transform: uppercase; color: #64748b;">Auffälligkeiten an Stationen:</strong>
              <div class="pdf-text-box" style="margin-top: 2px;">${stat}</div>
            </div>
            <div style="margin-bottom: 8px;">
              <strong style="font-size: 8pt; text-transform: uppercase; color: #64748b;">Defekte & Störungen:</strong>
              <div class="pdf-text-box" style="margin-top: 2px;">${def}</div>
            </div>
            <div>
              <strong style="font-size: 8pt; text-transform: uppercase; color: #64748b;">Material / KVP / Werkzeug:</strong>
              <div class="pdf-text-box" style="margin-top: 2px;">${mat}</div>
            </div>
          </div>

          <div class="pdf-footer">
            <span>Schichtbuch Galvanik - Automatisch generiert</span>
            <span>Seite ${index + 1} von ${activeAnlagen.length}</span>
          </div>
        </div>
      `;
    });

    // PDF mit jsPDF erstellen
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('portrait', 'pt', 'a4');

    for (let i = 0; i < activeAnlagen.length; i++) {
      const pageEl = document.getElementById(`pdf-page-${i}`);
      
      const canvas = await html2canvas(pageEl, {
        scale: 2,
        useCORS: true,
        logging: false
      });

      const imgData = canvas.toDataURL('image/jpeg', 0.98);
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = pdf.internal.pageSize.getHeight();

      if (i > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
    }

    const pdfBlob = pdf.output('blob');
    const pdfUrl = URL.createObjectURL(pdfBlob);

    btn.innerText = "PDF Erstellen & Öffnen";
    btn.style.opacity = "1";

    // Direkt im iPhone öffnen
    window.location.href = pdfUrl;
  }
</script>

</body>
</html>
