<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Schichtbuch Bandgalvanik</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #121824;
      --card-bg: #1e2638;
      --accent-red: #ff4d4d;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; font-size: 14px; }
    .container { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 12px; color: #ffffff; }

    .card { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; padding-bottom: 4px; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
    .card-title.red { border-bottom-color: var(--accent-red); }
    .card-title.green { border-bottom-color: var(--accent-green); }
    .card-title.purple { border-bottom-color: var(--accent-purple); }

    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; margin-bottom: 3px; }
    input, select, textarea { width: 100%; padding: 10px; background: #111827; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    textarea { resize: vertical; min-height: 50px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tab-container { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px 0; background: #1f2937; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
    
    .anlage-content { display: none; }
    .anlage-content.active { display: block; }

    .btn-submit { width: 100%; padding: 14px; background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-reset { width: 100%; padding: 10px; background: #374151; color: var(--text-muted); border: none; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-hist { padding: 8px; background: #2d3748; color: #e2e8f0; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; flex: 1; }

    .sub-error { border-top: 1px dashed var(--border-color); margin-top: 10px; padding-top: 8px; }
    .sub-error-title { font-size: 0.8rem; font-weight: bold; color: var(--accent-orange); margin-bottom: 4px; }

    .ausschuss-badge { font-size: 0.8rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; background: #374151; color: #fff; }
    .ausschuss-badge.warn { background: #dc2626; color: #fff; }

    /* =========================================================
       PDF DESIGN (A4 Querformat: 1123px x 794px)
       ========================================================= */
    #pdf-container {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1123px;
      background: #ffffff;
      color: #1f2937;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .pdf-page {
      width: 1123px;
      height: 794px;
      padding: 25px;
      background: #ffffff;
      box-sizing: border-box;
      position: relative;
    }

    .pdf-header {
      background: #1e293b;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pdf-header h2 { font-size: 15pt; font-weight: bold; }
    .pdf-header .badge { background: #3b82f6; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 10pt; font-weight: bold; }

    .pdf-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .pdf-meta-item label { font-size: 7pt; text-transform: uppercase; color: #64748b; font-weight: bold; display: block; }
    .pdf-meta-item div { font-size: 9.5pt; font-weight: 600; color: #0f172a; }

    .pdf-anlagen-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .pdf-anlage-card {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 8pt;
    }

    .pdf-anlage-title {
      background: #0f172a;
      color: #ffffff;
      font-weight: bold;
      text-align: center;
      padding: 5px;
      font-size: 9.5pt;
    }

    .pdf-card-body { padding: 6px; flex: 1; display: flex; flex-direction: column; gap: 6px; }

    .pdf-block {
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      padding: 5px;
      border-radius: 4px;
    }

    .pdf-block-title {
      font-size: 7pt;
      font-weight: bold;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 2px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 2px;
      display: flex;
      justify-content: space-between;
    }

    .pdf-block-title.red { color: #dc2626; border-bottom-color: #fca5a5; }
    .pdf-block-title.green { color: #059669; border-bottom-color: #6ee7b7; }

    .pdf-val { font-size: 8pt; color: #1e293b; white-space: pre-wrap; word-break: break-word; }

    .pdf-footer {
      position: absolute;
      bottom: 12px;
      left: 25px;
      right: 25px;
      border-top: 1px solid #e2e8f0;
      padding-top: 5px;
      display: flex;
      justify-content: space-between;
      font-size: 7pt;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container" id="main-form">
  <h1>Schichtbuch Bandgalvanik</h1>

  <div class="card">
    <div class="card-title purple">
      <span>Schicht-Historie</span>
      <span style="font-size: 0.75rem; font-weight: normal; color: var(--text-muted);">Zurückblättern</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <button type="button" class="btn-hist" onclick="loadHistory(1)" id="hist-btn-1">Letzte Schicht (-1)</button>
      <button type="button" class="btn-hist" onclick="loadHistory(2)" id="hist-btn-2">Vorletzte Schicht (-2)</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Schichtdaten</div>
    <div class="grid-2">
      <div>
        <label for="datum">Datum</label>
        <input type="date" id="datum">
      </div>
      <div>
        <label for="schicht">Schicht</label>
        <select id="schicht">
          <option value="Frühschicht">Frühschicht</option>
          <option value="Spätschicht">Spätschicht</option>
          <option value="Nachtschicht">Nachtschicht</option>
        </select>
      </div>
    </div>
    <label for="bediener">Schichtführer / Bediener</label>
    <input type="text" id="bediener" placeholder="Name(n) eintragen">
  </div>

  <div class="tab-container">
    <button class="tab-btn active" onclick="showAnlage('801', event)">A 801</button>
    <button class="tab-btn" onclick="showAnlage('802', event)">A 802</button>
    <button class="tab-btn" onclick="showAnlage('803', event)">A 803</button>
    <button class="tab-btn" onclick="showAnlage('804', event)">A 804</button>
  </div>

  <form id="schichtForm">
    <script>
      const anlagen = ['801', '802', '803', '804'];
      const ursachenOptions = `
        <option value="Kein Ausschuss">Kein Ausschuss</option>
        <option value="Bandriss">Bandriss</option>
        <option value="Beschichtungsfehler">Beschichtungsfehler</option>
        <option value="Mechanischer Defekt">Mechanischer Defekt</option>
        <option value="Verbogenes Werkzeug">Verbogenes Werkzeug</option>
        <option value="Einstellteile Stanzerei">Einstellteile Stanzerei</option>
        <option value="Reinigungsfehler / Flecken">Reinigungsfehler / Flecken</option>
        <option value="Sonstiges">Sonstiges</option>
      `;

      anlagen.forEach((a, index) => {
        document.write(`
          <div id="anlage-${a}" class="anlage-content ${index === 0 ? 'active' : ''}">
            
            <div class="card">
              <div class="card-title green">Produktion & Artikel</div>
              <label>Gut-Menge (m / Stk)</label>
              <input type="number" id="gut_menge_${a}" placeholder="z. B. 5000" oninput="calcAusschussPercent('${a}')">
              
              <div class="grid-2" style="margin-top:4px;">
                <div>
                  <label>Aktuelle Artikelnummer</label>
                  <input type="text" id="art_akt_${a}" placeholder="Artikel-Nr.">
                </div>
                <div>
                  <label>Folge-Artikelnummer</label>
                  <input type="text" id="art_folge_${a}" placeholder="Nächste Artikel-Nr.">
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title red">
                <span>Ausschuss & Fehler - A ${a}</span>
                <span class="ausschuss-badge" id="badge_pct_${a}">0.0% Quote</span>
              </div>
              
              <div class="grid-2">
                <div>
                  <label>Ausschuss (m / Stk)</label>
                  <input type="number" id="ausschuss_menge_${a}_1" placeholder="0" oninput="calcAusschussPercent('${a}')">
                </div>
                <div>
                  <label>Hauptursache 1</label>
                  <select id="ausschuss_grund_${a}_1">${ursachenOptions}</select>
                </div>
              </div>
              <label>Details zu Fehler 1</label>
              <textarea id="ausschuss_details_${a}_1" placeholder="Beschreibung Fehler 1"></textarea>

              <div class="sub-error">
                <div class="sub-error-title">+ Option: Fehler 2</div>
                <div class="grid-2">
                  <div>
                    <label>Ausschuss 2 (m / Stk)</label>
                    <input type="number" id="ausschuss_menge_${a}_2" placeholder="0" oninput="calcAusschussPercent('${a}')">
                  </div>
                  <div>
                    <label>Hauptursache 2</label>
                    <select id="ausschuss_grund_${a}_2">${ursachenOptions}</select>
                  </div>
                </div>
                <label>Details zu Fehler 2</label>
                <textarea id="ausschuss_details_${a}_2" placeholder="Beschreibung Fehler 2"></textarea>
              </div>

              <div class="sub-error">
                <div class="sub-error-title">+ Option: Fehler 3</div>
                <div class="grid-2">
                  <div>
                    <label>Ausschuss 3 (m / Stk)</label>
                    <input type="number" id="ausschuss_menge_${a}_3" placeholder="0" oninput="calcAusschussPercent('${a}')">
                  </div>
                  <div>
                    <label>Hauptursache 3</label>
                    <select id="ausschuss_grund_${a}_3">${ursachenOptions}</select>
                  </div>
                </div>
                <label>Details zu Fehler 3</label>
                <textarea id="ausschuss_details_${a}_3" placeholder="Beschreibung Fehler 3"></textarea>
              </div>

            </div>

            <div class="card">
              <div class="card-title green">To-Do für Folgeschicht</div>
              <textarea id="todo_${a}" placeholder="Was muss die nächste Schicht erledigen?"></textarea>
            </div>

            <div class="card">
              <div class="card-title">Stationen & Besonderheiten</div>
              <label>Auffälligkeiten an den Stationen</label>
              <textarea id="stationen_${a}" placeholder="Abwickeln, Schweißen, Hot Wash, US-Clean..."></textarea>
              <label>Defekte & technische Störungen</label>
              <textarea id="defekte_${a}" placeholder="Was war defekt?"></textarea>
              <label>Fehlendes Werkzeug / Materialien / KVP</label>
              <textarea id="material_${a}" placeholder="Bestellungen, fehlende Teile, Verbesserungen"></textarea>
            </div>

          </div>
        `);
      });
    </script>

    <button type="button" id="submitBtn" class="btn-submit" onclick="generateShiftPDF()">
      PDF Erstellen & Öffnen
    </button>
    <button type="button" class="btn-reset" onclick="resetFormKeepArtikel()">
      Neues Protokoll starten (Bediener & Artikel behalten)
    </button>
  </form>
</div>

<div id="pdf-container"></div>

<script>
  const formElement = id => document.getElementById(id);

  // Initiales Datum
  document.getElementById('datum').valueAsDate = new Date();

  function showAnlage(anl, event) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.anlage-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`anlage-${anl}`).classList.add('active');
  }

  // Berechnung Ausschuss-Prozentsatz
  function calcAusschussPercent(a) {
    const gut = parseFloat(formElement(`gut_menge_${a}`).value) || 0;
    const a1 = parseFloat(formElement(`ausschuss_menge_${a}_1`).value) || 0;
    const a2 = parseFloat(formElement(`ausschuss_menge_${a}_2`).value) || 0;
    const a3 = parseFloat(formElement(`ausschuss_menge_${a}_3`).value) || 0;

    const gesamtAusschuss = a1 + a2 + a3;
    const gesamtProduktion = gut + gesamtAusschuss;

    let pct = 0;
    if (gesamtProduktion > 0) {
      pct = (gesamtAusschuss / gesamtProduktion) * 100;
    }

    const badge = formElement(`badge_pct_${a}`);
    if (badge) {
      badge.innerText = `${pct.toFixed(1)}% Quote`;
      if (pct > 0) {
        badge.classList.add('warn');
      } else {
        badge.classList.remove('warn');
      }
    }
    return pct.toFixed(1);
  }

  // LocalStorage Auto-Save
  function saveToLocalStorage() {
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(el => {
      if (el.id) {
        localStorage.setItem('schichtbuch_' + el.id, el.value);
      }
    });
  }

  function loadFromLocalStorage() {
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(el => {
      if (el.id) {
        const val = localStorage.getItem('schichtbuch_' + el.id);
        if (val !== null) el.value = val;
      }
    });
    if (!localStorage.getItem('schichtbuch_datum')) {
      document.getElementById('datum').valueAsDate = new Date();
    }
    ['801', '802', '803', '804'].forEach(a => calcAusschussPercent(a));
    updateHistoryButtons();
  }

  // Historie-Logik (Speichern der letzten 2 Schichten)
  function saveCurrentToHistory() {
    const currentData = {};
    document.querySelectorAll('input, select, textarea').forEach(el => {
      if (el.id) currentData[el.id] = el.value;
    });

    let history = JSON.parse(localStorage.getItem('schichtbuch_history') || '[]');
    // Nur speichern, wenn Schicht oder Bediener ausgefüllt sind
    if (currentData['bediener'] || currentData['datum']) {
      history.unshift(currentData); // Vorne anfügen
      if (history.length > 5) history = history.slice(0, 5); // Max 5 speichern
      localStorage.setItem('schichtbuch_history', JSON.stringify(history));
    }
  }

  function updateHistoryButtons() {
    const history = JSON.parse(localStorage.getItem('schichtbuch_history') || '[]');
    const btn1 = formElement('hist-btn-1');
    const btn2 = formElement('hist-btn-2');

    if (history[0]) {
      btn1.innerText = `Letchte (-1): ${history[0].schicht || ''} (${history[0].datum || ''})`;
      btn1.disabled = false;
    } else {
      btn1.innerText = "Letzte Schicht (-1) [Leer]";
      btn1.disabled = true;
    }

    if (history[1]) {
      btn2.innerText = `Vorletzte (-2): ${history[1].schicht || ''} (${history[1].datum || ''})`;
      btn2.disabled = false;
    } else {
      btn2.innerText = "Vorletzte Schicht (-2) [Leer]";
      btn2.disabled = true;
    }
  }

  function loadHistory(index) {
    const history = JSON.parse(localStorage.getItem('schichtbuch_history') || '[]');
    const item = history[index - 1];
    if (!item) return;

    if (confirm(`Möchtest du das Protokoll vom ${item.datum} (${item.schicht}) anzeigen/laden?`)) {
      Object.keys(item).forEach(key => {
        const field = formElement(key);
        if (field) field.value = item[key];
      });
      saveToLocalStorage();
      ['801', '802', '803', '804'].forEach(a => calcAusschussPercent(a));
      alert("Historien-Daten geladen!");
    }
  }

  // Event Listener anhängen
  document.addEventListener('DOMContentLoaded', () => {
    loadFromLocalStorage();
    document.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('input', saveToLocalStorage);
      el.addEventListener('change', saveToLocalStorage);
    });
  });

  // Neues Protokoll starten: Datum auf heute, Bediener und Artikel-Nr. BEHALTEN
  function resetFormKeepArtikel() {
    if (confirm("Neues Protokoll starten? Bediener & Artikelnummern bleiben erhalten, das alte Protokoll wandert in die Historie.")) {
      // Vorherige Schicht in Historie sichern
      saveCurrentToHistory();

      const savedBediener = formElement('bediener').value;
      const savedArtAkt = {};
      const savedArtFolge = {};

      ['801', '802', '803', '804'].forEach(a => {
        savedArtAkt[a] = formElement(`art_akt_${a}`).value;
        savedArtFolge[a] = formElement(`art_folge_${a}`).value;
      });

      // LocalStorage löschen
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith('schichtbuch_') && key !== 'schichtbuch_history') {
          localStorage.removeItem(key);
        }
      });

      // Formular zurücksetzen
      document.getElementById('schichtForm').reset();
      document.getElementById('datum').valueAsDate = new Date();

      // Bediener und Artikelnummern wieder einfügen
      formElement('bediener').value = savedBediener || '';
      ['801', '802', '803', '804'].forEach(a => {
        formElement(`art_akt_${a}`).value = savedArtAkt[a] || '';
        formElement(`art_folge_${a}`).value = savedArtFolge[a] || '';
        calcAusschussPercent(a);
      });

      saveToLocalStorage();
      updateHistoryButtons();
      alert("Sauberes Formular geladen! Bediener & Artikelnummern wurden übernommen.");
    }
  }

  async function generateShiftPDF() {
    const btn = document.getElementById('submitBtn');
    btn.innerText = "Erstelle Schichtblatt...";
    btn.style.opacity = "0.5";

    const datumVal = formElement('datum').value || '-';
    const schichtVal = formElement('schicht').value;
    const bedienerVal = formElement('bediener').value || '-';

    const pdfContainer = document.getElementById('pdf-container');
    pdfContainer.innerHTML = '';

    let anlagenHTML = '';
    ['801', '802', '803', '804'].forEach(a => {
      const gutMenge = formElement(`gut_menge_${a}`).value || '0';
      const artAkt = formElement(`art_akt_${a}`).value || '-';
      const artFolge = formElement(`art_folge_${a}`).value || '-';
      const todo = formElement(`todo_${a}`).value || '-';
      const stat = formElement(`stationen_${a}`).value || '-';
      const def = formElement(`defekte_${a}`).value || '-';
      const mat = formElement(`material_${a}`).value || '-';
      const pctVal = calcAusschussPercent(a);

      // Fehler 1 - 3 zusammenbauen
      let ausschussBlockHTML = '';
      for (let i = 1; i <= 3; i++) {
        const menge = formElement(`ausschuss_menge_${a}_${i}`).value || '0';
        const grund = formElement(`ausschuss_grund_${a}_${i}`).value;
        const det = formElement(`ausschuss_details_${a}_${i}`).value;

        if ((menge !== '0' && menge !== '') || grund !== 'Kein Ausschuss' || det !== '') {
          ausschussBlockHTML += `
            <div style="margin-bottom: 3px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 2px;">
              <b>Menge:</b> <span style="color:#dc2626; font-weight:bold;">${menge}</span> | <b>Ursache:</b> ${grund}
              ${det ? `<br><i>${det}</i>` : ''}
            </div>
          `;
        }
      }

      if (!ausschussBlockHTML) {
        ausschussBlockHTML = '<div class="pdf-val">Kein Ausschuss</div>';
      }

      anlagenHTML += `
        <div class="pdf-anlage-card">
          <div class="pdf-anlage-title">ANLAGE ${a}</div>
          <div class="pdf-card-body">
            
            <div class="pdf-block">
              <div class="pdf-block-title green">Produktion</div>
              <div class="pdf-val"><b>Gut-Menge:</b> ${gutMenge}</div>
              <div class="pdf-val"><b>Artikel-Nr:</b> ${artAkt}</div>
              <div class="pdf-val"><b>Folge-Art.:</b> ${artFolge}</div>
            </div>

            <div class="pdf-block">
              <div class="pdf-block-title red">
                <span>Ausschuss & Ursachen</span>
                <span><b>${pctVal}%</b></span>
              </div>
              ${ausschussBlockHTML}
            </div>

            <div class="pdf-block">
              <div class="pdf-block-title green">To-Do Folgeschicht</div>
              <div class="pdf-val">${todo}</div>
            </div>

            <div class="pdf-block" style="flex: 1;">
              <div class="pdf-block-title">Stationen & Störungen</div>
              <div class="pdf-val"><b>Stationen:</b> ${stat}</div>
              <div class="pdf-val"><b>Defekte:</b> ${def}</div>
              <div class="pdf-val"><b>Material/KVP:</b> ${mat}</div>
            </div>

          </div>
        </div>
      `;
    });

    pdfContainer.innerHTML = `
      <div class="pdf-page" id="pdf-shift-page">
        <div class="pdf-header">
          <div>
            <h2>SCHICHTBUCH PROTOKOLL</h2>
            <div style="font-size: 8.5pt; opacity: 0.8;">Bandgalvanik Gesamtbericht</div>
          </div>
          <div class="badge">${schichtVal.toUpperCase()}</div>
        </div>

        <div class="pdf-meta-grid">
          <div class="pdf-meta-item">
            <label>Datum</label>
            <div>${datumVal}</div>
          </div>
          <div class="pdf-meta-item">
            <label>Schicht</label>
            <div>${schichtVal}</div>
          </div>
          <div class="pdf-meta-item">
            <label>Schichtführer / Bediener</label>
            <div>${bedienerVal}</div>
          </div>
        </div>

        <div class="pdf-anlagen-grid">
          ${anlagenHTML}
        </div>

        <div class="pdf-footer">
          <span>Schichtbuch Protokoll - Bandgalvanik</span>
          <span>1 Blatt pro Schicht</span>
        </div>
      </div>
    `;

    // Canvas & PDF Rendern (A4 Querformat)
    const pageEl = document.getElementById('pdf-shift-page');
    const canvas = await html2canvas(pageEl, {
      scale: 2,
      useCORS: true,
      logging: false
    });

    const imgData = canvas.toDataURL('image/jpeg', 0.98);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('landscape', 'pt', 'a4');

    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = pdf.internal.pageSize.getHeight();

    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);

    const pdfBlob = pdf.output('blob');
    const pdfUrl = URL.createObjectURL(pdfBlob);

    btn.innerText = "PDF Erstellen & Öffnen";
    btn.style.opacity = "1";

    window.location.href = pdfUrl;
  }
</script>

</body>
</html>
