<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schichtbuch Protokoll</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e2738;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; font-size: 14px; padding-bottom: 80px; }

        .header { text-align: center; margin-bottom: 15px; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .header h1 { font-size: 18px; color: #fff; }

        /* Banner für geladene Historie */
        .history-banner {
            display: none;
            background-color: var(--warning-color);
            color: #000;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Navigations-Buttons für Historie */
        .history-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn-history {
            background-color: #374151;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-history:active { background-color: #4b5563; }

        /* Globale Schichtdaten */
        .global-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .form-group { margin-bottom: 10px; }
        .form-group:last-child { margin-bottom: 0; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #111827;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-color); }

        /* Anlage Tabs */
        .tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active { background-color: var(--accent-color); color: #fff; border-color: var(--accent-color); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-title { font-size: 13px; font-weight: bold; color: #93c5fd; margin: 12px 0 6px 0; text-transform: uppercase; letter-spacing: 0.5px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* Ausschuss Box */
        .ausschuss-box {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .ausschuss-item {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid var(--danger-color);
        }

        .rate-badge {
            background-color: var(--danger-color);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
            font-size: 12px;
        }

        /* Action Buttons */
        .btn-main {
            width: 100%;
            padding: 14px;
            background-color: var(--success-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-reset {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* FIX FÜR SAFARI / MOBILE: Vorlage ist fixed außerhalb des Screens, aber voll gerendert */
        #pdf-template {
            position: fixed;
            left: -9999px;
            top: 0;
            width: 1020px;
            background-color: #ffffff !important;
            color: #000000 !important;
            padding: 15px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
        .pdf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e40af;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .pdf-header h2 { font-size: 20px; color: #1e40af; margin: 0; text-transform: uppercase; }
        .pdf-info { font-size: 12px; color: #334155; font-weight: bold; }

        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .pdf-col {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px;
            background-color: #f8fafc;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .pdf-col-title {
            background-color: #1e40af;
            color: #ffffff;
            padding: 6px;
            font-weight: bold;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .pdf-section { margin-bottom: 8px; }
        .pdf-label { font-weight: bold; color: #475569; font-size: 9px; text-transform: uppercase; }
        .pdf-val { font-size: 10px; color: #0f172a; margin-top: 2px; word-break: break-word; }
        
        .pdf-loss-box {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            padding: 6px;
            border-radius: 4px;
            margin: 6px 0;
        }
        .pdf-badge-red {
            color: #dc2626;
            font-weight: bold;
        }
        .pdf-rate-highlight {
            background-color: #dc2626;
            color: #ffffff;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 10px;
            display: inline-block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Schichtbuch Protokoll</h1>
    </div>

    <div id="historyBanner" class="history-banner">
        ⚠️ Du bearbeitest eine geladene Schicht aus der Historie!
    </div>

    <div class="history-controls">
        <button class="btn-history" onclick="loadHistoryShift(1)">⏮️ Vorherige Schicht (-1)</button>
        <button class="btn-history" onclick="loadHistoryShift(2)">⏮️ Vorvorherige Schicht (-2)</button>
    </div>

    <div class="global-card">
        <div class="grid-2">
            <div class="form-group">
                <label for="datum">Datum</label>
                <input type="date" id="datum">
            </div>
            <div class="form-group">
                <label for="schicht">Schicht</label>
                <select id="schicht">
                    <option value="Frühschicht">Frühschicht</option>
                    <option value="Spätschicht">Spätschicht</option>
                    <option value="Nachtschicht">Nachtschicht</option>
                </select>
            </div>
        </div>
        <div class="form-group" style="margin-top: 8px;">
            <label for="schichtfuehrer">Schichtführer / Bediener</label>
            <input type="text" id="schichtfuehrer" placeholder="Name eintragen">
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('801')">Anlage 801</button>
        <button class="tab-btn" onclick="switchTab('802')">Anlage 802</button>
        <button class="tab-btn" onclick="switchTab('803')">Anlage 803</button>
        <button class="tab-btn" onclick="switchTab('804')">Anlage 804</button>
    </div>

    <div id="anlagenContainer"></div>

    <button class="btn-main" onclick="generatePDFAndOpen()">📄 Protokoll als PDF erstellen & ansehen</button>
    <button class="btn-reset" onclick="resetFormular(true)">🔄 Neues Protokoll starten (Felder leeren)</button>

    <div id="pdf-template">
        <div class="pdf-header">
            <div>
                <h2>SCHICHTBUCH PROTOKOLL</h2>
                <div class="pdf-info" id="pdf-meta-info">Datum: - | Schicht: - | Bediener: -</div>
            </div>
            <div style="text-align: right; font-size: 10px; color: #64748b;">
                Erstellt am: <span id="pdf-created-time"></span>
            </div>
        </div>
        <div class="pdf-grid" id="pdf-grid-content"></div>
    </div>

    <script>
        const anlagen = ['801', '802', '803', '804'];
        const ursachenOptionen = [
            "Kein Fehler",
            "Bandriss",
            "Beschichtungsfehler",
            "Mechanischer Defekt",
            "Verbogenes Werkzeug",
            "Einstellteile Stanzerei",
            "Flecken / Reinigungsproblem",
            "Sonstiges"
        ];

        let loadedHistoryIndex = null;

        // Formular-Felder dynamisch erzeugen
        function buildForm() {
            const container = document.getElementById('anlagenContainer');
            container.innerHTML = '';

            anlagen.forEach((a, index) => {
                const activeClass = index === 0 ? 'active' : '';
                let ursachenHTML = ursachenOptionen.map(o => `<option value="${o}">${o}</option>`).join('');

                container.innerHTML += `
                    <div id="tab-${a}" class="tab-content ${activeClass}">
                        <div class="global-card">
                            <div class="section-title">Auftragsdaten (Anlage ${a})</div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label>Aktuelle Artikel-Nr.</label>
                                    <input type="text" id="art_akt_${a}" placeholder="z. B. 464848-E">
                                </div>
                                <div class="form-group">
                                    <label>Folge-Artikel-Nr.</label>
                                    <input type="text" id="art_folge_${a}" placeholder="z. B. 515200-E">
                                </div>
                            </div>

                            <div class="section-title">Mengen & Ausschuss (Schlechte Teile)</div>
                            <div class="ausschuss-box">
                                <div class="form-group">
                                    <label>Gut-Menge (m / Stk)</label>
                                    <input type="number" id="gut_menge_${a}" placeholder="0" oninput="calcLoss('${a}')">
                                </div>
                                
                                <div style="margin-top: 10px; margin-bottom: 6px; font-weight: bold; font-size: 12px; color: #fca5a5;">Ausschuss & Ursachen (bis zu 3 Angaben)</div>
                                
                                <div class="ausschuss-item">
                                    <div class="grid-2">
                                        <div>
                                            <label>Hauptursache 1</label>
                                            <select id="ausschuss_u1_${a}">${ursachenHTML}</select>
                                        </div>
                                        <div>
                                            <label>Ausschuss-Menge 1</label>
                                            <input type="number" id="ausschuss_m1_${a}" placeholder="0" oninput="calcLoss('${a}')">
                                        </div>
                                    </div>
                                    <div style="margin-top: 4px;">
                                        <label>Bemerkung / Detail zu Ursache 1</label>
                                        <input type="text" id="ausschuss_b1_${a}" placeholder="z. B. Stanzwerkzeug beschädigt">
                                    </div>
                                </div>

                                <div class="ausschuss-item">
                                    <div class="grid-2">
                                        <div>
                                            <label>Hauptursache 2</label>
                                            <select id="ausschuss_u2_${a}">${ursachenHTML}</select>
                                        </div>
                                        <div>
                                            <label>Ausschuss-Menge 2</label>
                                            <input type="number" id="ausschuss_m2_${a}" placeholder="0" oninput="calcLoss('${a}')">
                                        </div>
                                    </div>
                                    <div style="margin-top: 4px;">
                                        <label>Bemerkung / Detail zu Ursache 2</label>
                                        <input type="text" id="ausschuss_b2_${a}" placeholder="z. B. Flecken nach E-Clean">
                                    </div>
                                </div>

                                <div class="ausschuss-item">
                                    <div class="grid-2">
                                        <div>
                                            <label>Hauptursache 3</label>
                                            <select id="ausschuss_u3_${a}">${ursachenHTML}</select>
                                        </div>
                                        <div>
                                            <label>Ausschuss-Menge 3</label>
                                            <input type="number" id="ausschuss_m3_${a}" placeholder="0" oninput="calcLoss('${a}')">
                                        </div>
                                    </div>
                                    <div style="margin-top: 4px;">
                                        <label>Bemerkung / Detail zu Ursache 3</label>
                                        <input type="text" id="ausschuss_b3_${a}" placeholder="z. B. Bandriss bei Speicher">
                                    </div>
                                </div>

                                <div id="rate_badge_${a}" class="rate-badge">Ausschussquote: 0.0% (Ausschuss: 0)</div>
                            </div>

                            <div class="section-title">To-Do für Folgeschicht</div>
                            <div class="form-group">
                                <textarea id="todo_${a}" rows="2" placeholder="Offene Aufgaben..."></textarea>
                            </div>

                            <div class="section-title">Besonderheiten / Defekte / KVP</div>
                            <div class="form-group">
                                <textarea id="defekte_${a}" rows="2" placeholder="Bestellungen, fehlende Teile, Störungen..."></textarea>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Tab Wechsellogik
        function switchTab(anlage) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${anlage}`).classList.add('active');
        }

        // Prozentuale Ausschussquote berechnen
        function calcLoss(a) {
            const gut = parseFloat(document.getElementById(`gut_menge_${a}`).value) || 0;
            const m1 = parseFloat(document.getElementById(`ausschuss_m1_${a}`).value) || 0;
            const m2 = parseFloat(document.getElementById(`ausschuss_m2_${a}`).value) || 0;
            const m3 = parseFloat(document.getElementById(`ausschuss_m3_${a}`).value) || 0;

            const gesamtAusschuss = m1 + m2 + m3;
            const gesamt = gut + gesamtAusschuss;

            let quote = 0;
            if (gesamt > 0) {
                quote = ((gesamtAusschuss / gesamt) * 100).toFixed(1);
            }

            const badge = document.getElementById(`rate_badge_${a}`);
            badge.innerText = `Ausschussquote: ${quote}% (Ausschuss: ${gesamtAusschuss})`;
            
            saveCurrentState();
        }

        // Aktuellen Stand im LocalStorage sichern
        function saveCurrentState() {
            const data = collectFormData();
            localStorage.setItem('schichtbuch_current', JSON.stringify(data));
        }

        // Daten aus allen Feldern einsammeln
        function collectFormData() {
            let data = {
                datum: document.getElementById('datum').value,
                schicht: document.getElementById('schicht').value,
                schichtfuehrer: document.getElementById('schichtfuehrer').value,
                anlagenData: {}
            };

            anlagen.forEach(a => {
                data.anlagenData[a] = {
                    art_akt: document.getElementById(`art_akt_${a}`).value,
                    art_folge: document.getElementById(`art_folge_${a}`).value,
                    gut_menge: document.getElementById(`gut_menge_${a}`).value,
                    u1: document.getElementById(`ausschuss_u1_${a}`).value,
                    m1: document.getElementById(`ausschuss_m1_${a}`).value,
                    b1: document.getElementById(`ausschuss_b1_${a}`).value,
                    u2: document.getElementById(`ausschuss_u2_${a}`).value,
                    m2: document.getElementById(`ausschuss_m2_${a}`).value,
                    b2: document.getElementById(`ausschuss_b2_${a}`).value,
                    u3: document.getElementById(`ausschuss_u3_${a}`).value,
                    m3: document.getElementById(`ausschuss_m3_${a}`).value,
                    b3: document.getElementById(`ausschuss_b3_${a}`).value,
                    todo: document.getElementById(`todo_${a}`).value,
                    defekte: document.getElementById(`defekte_${a}`).value
                };
            });
            return data;
        }

        // Daten zurück in das Formular schreiben
        function populateForm(data) {
            if (!data) return;

            if (data.datum) document.getElementById('datum').value = data.datum;
            if (data.schicht) document.getElementById('schicht').value = data.schicht;
            if (data.schichtfuehrer) document.getElementById('schichtfuehrer').value = data.schichtfuehrer;

            if (data.anlagenData) {
                anlagen.forEach(a => {
                    const ad = data.anlagenData[a];
                    if (ad) {
                        document.getElementById(`art_akt_${a}`).value = ad.art_akt || '';
                        document.getElementById(`art_folge_${a}`).value = ad.art_folge || '';
                        document.getElementById(`gut_menge_${a}`).value = ad.gut_menge || '';
                        
                        document.getElementById(`ausschuss_u1_${a}`).value = ad.u1 || 'Kein Fehler';
                        document.getElementById(`ausschuss_m1_${a}`).value = ad.m1 || '';
                        document.getElementById(`ausschuss_b1_${a}`).value = ad.b1 || '';

                        document.getElementById(`ausschuss_u2_${a}`).value = ad.u2 || 'Kein Fehler';
                        document.getElementById(`ausschuss_m2_${a}`).value = ad.m2 || '';
                        document.getElementById(`ausschuss_b2_${a}`).value = ad.b2 || '';

                        document.getElementById(`ausschuss_u3_${a}`).value = ad.u3 || 'Kein Fehler';
                        document.getElementById(`ausschuss_m3_${a}`).value = ad.m3 || '';
                        document.getElementById(`ausschuss_b3_${a}`).value = ad.b3 || '';

                        document.getElementById(`todo_${a}`).value = ad.todo || '';
                        document.getElementById(`defekte_${a}`).value = ad.defekte || '';
                        calcLoss(a);
                    }
                });
            }
        }

        // Vergangene Schicht aus der Historie laden
        function loadHistoryShift(offset) {
            let history = JSON.parse(localStorage.getItem('schichtbuch_history') || '[]');
            if (history.length < offset) {
                alert(`Keine Daten für Schicht -${offset} in der Historie gefunden.`);
                return;
            }

            saveCurrentState();

            const targetData = history[history.length - offset];
            populateForm(targetData);
            
            loadedHistoryIndex = offset;
            const banner = document.getElementById('historyBanner');
            banner.style.display = 'block';
            banner.innerText = `⚠️ GELADEN: Historie (-${offset}) vom ${targetData.datum} (${targetData.schicht}). Du kannst die Daten anpassen & als PDF erstellen!`;
        }

        // Schicht in Historie speichern
        function pushToHistory(data) {
            let history = JSON.parse(localStorage.getItem('schichtbuch_history') || '[]');
            history.push(data);
            if (history.length > 5) history.shift();
            localStorage.setItem('schichtbuch_history', JSON.stringify(history));
        }

        // Neues Protokoll starten / Reset
        function resetFormular(manualClick = false) {
            const currentData = collectFormData();
            if (manualClick) {
                pushToHistory(currentData);
            }

            const lastBediener = document.getElementById('schichtfuehrer').value;
            let lastArticles = {};
            anlagen.forEach(a => {
                lastArticles[a] = document.getElementById(`art_akt_${a}`).value;
            });

            document.querySelectorAll('input[type="number"], input[type="text"], textarea').forEach(i => {
                if (i.id !== 'schichtfuehrer' && !i.id.startsWith('art_akt_')) {
                    i.value = '';
                }
            });
            document.querySelectorAll('select[id^="ausschuss_u"]').forEach(s => s.value = 'Kein Fehler');

            document.getElementById('schichtfuehrer').value = lastBediener;
            document.getElementById('datum').valueAsDate = new Date();
            
            anlagen.forEach(a => {
                if (lastArticles[a]) document.getElementById(`art_akt_${a}`).value = lastArticles[a];
                calcLoss(a);
            });

            loadedHistoryIndex = null;
            document.getElementById('historyBanner').style.display = 'none';
            saveCurrentState();
        }

        // PDF Generierung & Vorschau öffnen
        function generatePDFAndOpen() {
            const formData = collectFormData();
            
            pushToHistory(formData);

            document.getElementById('pdf-meta-info').innerText = `Datum: ${formData.datum || '-'} | Schicht: ${formData.schicht || '-'} | Bediener: ${formData.schichtfuehrer || '-'}`;
            document.getElementById('pdf-created-time').innerText = new Date().toLocaleString('de-DE');

            const grid = document.getElementById('pdf-grid-content');
            grid.innerHTML = '';

            anlagen.forEach(a => {
                const ad = formData.anlagenData[a];
                const m1 = parseFloat(ad.m1) || 0;
                const m2 = parseFloat(ad.m2) || 0;
                const m3 = parseFloat(ad.m3) || 0;
                const totalAusschuss = m1 + m2 + m3;
                const gut = parseFloat(ad.gut_menge) || 0;
                const gesamt = gut + totalAusschuss;
                const quote = gesamt > 0 ? ((totalAusschuss / gesamt) * 100).toFixed(1) : '0.0';

                let errorsHTML = '';
                if (m1 > 0) errorsHTML += `<div>• <b>${ad.u1}</b>: ${m1} Stk ${ad.b1 ? '(' + ad.b1 + ')' : ''}</div>`;
                if (m2 > 0) errorsHTML += `<div>• <b>${ad.u2}</b>: ${m2} Stk ${ad.b2 ? '(' + ad.b2 + ')' : ''}</div>`;
                if (m3 > 0) errorsHTML += `<div>• <b>${ad.u3}</b>: ${m3} Stk ${ad.b3 ? '(' + ad.b3 + ')' : ''}</div>`;
                if (!errorsHTML) errorsHTML = '<div>Kein Ausschuss gemeldet</div>';

                grid.innerHTML += `
                    <div class="pdf-col">
                        <div>
                            <div class="pdf-col-title">ANLAGE ${a}</div>
                            
                            <div class="pdf-section">
                                <div class="pdf-label">Artikel-Nr. (Aktual / Folge):</div>
                                <div class="pdf-val"><b>${ad.art_akt || '-'}</b> / ${ad.art_folge || '-'}</div>
                            </div>

                            <div class="pdf-section">
                                <div class="pdf-label">Mengenübersicht:</div>
                                <div class="pdf-val">Gut-Menge: <b>${ad.gut_menge || '0'}</b></div>
                                <div class="pdf-val">Gesamtausschuss: <span class="pdf-badge-red">${totalAusschuss}</span></div>
                            </div>

                            <div class="pdf-loss-box">
                                <div class="pdf-label" style="color: #991b1b;">Ausschuss & Ursachen:</div>
                                <div class="pdf-val">${errorsHTML}</div>
                                <div class="pdf-rate-highlight">Ausschussquote: ${quote}%</div>
                            </div>

                            <div class="pdf-section">
                                <div class="pdf-label">To-Do Folgeschicht:</div>
                                <div class="pdf-val">${ad.todo || 'Keine'}</div>
                            </div>
                        </div>

                        <div class="pdf-section" style="margin-top: 6px;">
                            <div class="pdf-label">Besonderheiten / Defekte / KVP:</div>
                            <div class="pdf-val">${ad.defekte || 'Keine'}</div>
                        </div>
                    </div>
                `;
            });

            const element = document.getElementById('pdf-template');
            
            // Konfiguration für A4 Querformat auf 1 Seite
            const opt = {
                margin:       [6, 6, 6, 6],
                filename:     `Schichtprotokoll_${formData.datum}_${formData.schicht}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, logging: false, useCORS: true, scrollX: 0, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            // PDF erstellen und direkt als Vorschau im Browser öffnen
            html2pdf().set(opt).from(element).outputPdf('bloburl').then(function(pdfUrl) {
                window.open(pdfUrl, '_blank');
            });
        }

        document.addEventListener('input', function(e) {
            saveCurrentState();
        });

        window.onload = function() {
            buildForm();
            document.getElementById('datum').valueAsDate = new Date();

            const saved = localStorage.getItem('schichtbuch_current');
            if (saved) {
                populateForm(JSON.parse(saved));
            }
        };
    </script>
</body>
</html>
