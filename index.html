<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Schichtbuch Bandgalvanik</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #121824;
      --card-bg: #1e2638;
      --accent-red: #ff4d4d;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; font-size: 14px; }
    .container { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 12px; color: #ffffff; }

    .card { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; padding-bottom: 4px; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; }
    .card-title.red { border-bottom-color: var(--accent-red); }
    .card-title.green { border-bottom-color: var(--accent-green); }

    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; margin-bottom: 3px; }
    input, select, textarea { width: 100%; padding: 10px; background: #111827; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    textarea { resize: vertical; min-height: 50px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tab-container { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px 0; background: #1f2937; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
    
    .anlage-content { display: none; }
    .anlage-content.active { display: block; }

    .btn-submit { width: 100%; padding: 14px; background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-reset { width: 100%; padding: 10px; background: #374151; color: var(--text-muted); border: none; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-archive { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; }

    .sub-error { border-top: 1px dashed var(--border-color); margin-top: 10px; padding-top: 8px; }
    .sub-error-title { font-size: 0.8rem; font-weight: bold; color: var(--accent-orange); margin-bottom: 4px; }

    /* Bearbeitungs-Banner */
    .edit-mode-banner {
      display: none;
      background: var(--accent-orange);
      color: #000;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 0.85rem;
    }
    .btn-cancel-edit {
      background: #000;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-top: 6px;
      cursor: pointer;
    }

    /* Modal / Archiv CSS */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: var(--card-bg); border-radius: 10px; width: 100%; max-width: 450px; max-height: 85vh; display: flex; flex-direction: column; border: 1px solid var(--border-color); padding: 15px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .modal-title { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .archive-list { overflow-y: auto; flex: 1; margin-bottom: 10px; }
    .archive-item { background: #111827; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .archive-item:hover { border-color: var(--accent-blue); }
    .archive-info { font-size: 0.85rem; }
    .archive-date { font-weight: bold; color: var(--accent-blue); }
    .btn-load { background: var(--accent-green); color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

    .confirm-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
    .btn-modal-action { padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-modal-primary { background: var(--accent-blue); color: #fff; }
    .btn-modal-secondary { background: #4b5563; color: #fff; }
    .btn-modal-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }

    /* =========================================================
       PDF DESIGN (A4 Querformat: 1123px x 794px)
       ========================================================= */
    #pdf-container {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1123px;
      background: #ffffff;
      color: #1f2937;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .pdf-page {
      width: 1123px;
      height: 794px;
      padding: 25px;
      background: #ffffff;
      box-sizing: border-box;
      position: relative;
    }

    .pdf-header {
      background: #1e293b;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pdf-header h2 { font-size: 15pt; font-weight: bold; }
    .pdf-header .badge { background: #3b82f6; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 10pt; font-weight: bold; }

    .pdf-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .pdf-meta-item label { font-size: 7pt; text-transform: uppercase; color: #64748b; font-weight: bold; display: block; }
    .pdf-meta-item div { font-size: 9.5pt; font-weight: 600; color: #0f172a; }

    .pdf-anlagen-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .pdf-anlage-card {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 8pt;
    }

    .pdf-anlage-title {
      background: #0f172a;
      color: #ffffff;
      font-weight: bold;
      text-align: center;
      padding: 5px;
      font-size: 9.5pt;
    }

    .pdf-card-body { padding: 6px; flex: 1; display: flex; flex-direction: column; gap: 6px; }

    .pdf-block {
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      padding: 5px;
      border-radius: 4px;
    }

    .pdf-block-title {
      font-size: 7pt;
      font-weight: bold;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 2px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 2px;
    }

    .pdf-block-title.red { color: #dc2626; border-bottom-color: #fca5a5; }
    .pdf-block-title.green { color: #059669; border-bottom-color: #6ee7b7; }

    .pdf-val { font-size: 8pt; color: #1e293b; white-space: pre-wrap; word-break: break-word; }

    .pdf-footer {
      position: absolute;
      bottom: 12px;
      left: 25px;
      right: 25px;
      border-top: 1px solid #e2e8f0;
      padding-top: 5px;
      display: flex;
      justify-content: space-between;
      font-size: 7pt;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container" id="main-form">
  <h1>Schichtbuch Bandgalvanik</h1>

  <button type="button" class="btn-archive" onclick="openArchiveModal()">
    📁 Schichtbuch-Archiv (letzte 50 Einträge)
  </button>

  <div id="editBanner" class="edit-mode-banner">
    ⚠️ Du bearbeitest einen bestehenden Archiv-Eintrag!<br>
    <button type="button" class="btn-cancel-edit" onclick="cancelEditMode()">Bearbeitung abbrechen & neue Schicht starten</button>
  </div>

  <div class="card">
    <div class="card-title">Schichtdaten</div>
    <div class="grid-2">
      <div>
        <label for="datum">Datum</label>
        <input type="date" id="datum">
      </div>
      <div>
        <label for="schicht">Schicht</label>
        <select id="schicht">
          <option value="Frühschicht">Frühschicht</option>
          <option value="Spätschicht">Spätschicht</option>
          <option value="Nachtschicht">Nachtschicht</option>
        </select>
      </div>
    </div>
    <label for="bediener">Schichtführer / Bediener</label>
    <input type="text" id="bediener" placeholder="Name(n) eintragen">
  </div>

  <div class="tab-container">
    <button class="tab-btn active" onclick="showAnlage('801', event)">A 801</button>
    <button class="tab-btn" onclick="showAnlage('802', event)">A 802</button>
    <button class="tab-btn" onclick="showAnlage('803', event)">A 803</button>
    <button class="tab-btn" onclick="showAnlage('804', event)">A 804</button>
  </div>

  <form id="schichtForm">
    <script>
      const anlagen = ['801', '802', '803', '804'];
      const ursachenOptions = `
        <option value="Kein Ausschuss">Kein Ausschuss</option>
        <option value="Bandriss">Bandriss</option>
        <option value="Beschichtungsfehler">Beschichtungsfehler</option>
        <option value="Mechanischer Defekt">Mechanischer Defekt</option>
        <option value="Verbogenes Werkzeug">Verbogenes Werkzeug</option>
        <option value="Einstellteile Stanzerei">Einstellteile Stanzerei</option>
        <option value="Reinigungsfehler / Flecken">Reinigungsfehler / Flecken</option>
        <option value="Sonstiges">Sonstiges</option>
      `;

      anlagen.forEach((a, index) => {
        document.write(`
          <div id="anlage-${a}" class="anlage-content ${index === 0 ? 'active' : ''}">
            
            <div class="card">
              <div class="card-title green">Produktion & Artikel</div>
              <label>Gut-Menge (m / Stk)</label>
              <input type="text" id="gut_menge_${a}" placeholder="z. B. 5000">
              
              <div class="grid-2" style="margin-top:4px;">
                <div>
                  <label>Aktuelle Artikelnummer</label>
                  <input type="text" id="art_akt_${a}" placeholder="Artikel-Nr.">
                </div>
                <div>
                  <label>Folge-Artikelnummer</label>
                  <input type="text" id="art_folge_${a}" placeholder="Nächste Artikel-Nr.">
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title red">Ausschuss & Fehler - Anlage ${a}</div>
              
              <div class="grid-2">
                <div>
                  <label>Ausschuss (m / Stk)</label>
                  <input type="text" id="ausschuss_menge_${a}_1" placeholder="0">
                </div>
                <div>
                  <label>Hauptursache 1</label>
                  <select id="ausschuss_grund_${a}_1">${ursachenOptions}</select>
                </div>
              </div>
              <label>Details zu Fehler 1</label>
              <textarea id="ausschuss_details_${a}_1" placeholder="Beschreibung Fehler 1"></textarea>

              <div class="sub-error">
                <div class="sub-error-title">+ Option: Fehler 2</div>
                <div class="grid-2">
                  <div>
                    <label>Ausschuss 2 (m / Stk)</label>
                    <input type="text" id="ausschuss_menge_${a}_2" placeholder="0">
                  </div>
                  <div>
                    <label>Hauptursache 2</label>
                    <select id="ausschuss_grund_${a}_2">${ursachenOptions}</select>
                  </div>
                </div>
                <label>Details zu Fehler 2</label>
                <textarea id="ausschuss_details_${a}_2" placeholder="Beschreibung Fehler 2"></textarea>
              </div>

              <div class="sub-error">
                <div class="sub-error-title">+ Option: Fehler 3</div>
                <div class="grid-2">
                  <div>
                    <label>Ausschuss 3 (m / Stk)</label>
                    <input type="text" id="ausschuss_menge_${a}_3" placeholder="0">
                  </div>
                  <div>
                    <label>Hauptursache 3</label>
                    <select id="ausschuss_grund_${a}_3">${ursachenOptions}</select>
                  </div>
                </div>
                <label>Details zu Fehler 3</label>
                <textarea id="ausschuss_details_${a}_3" placeholder="Beschreibung Fehler 3"></textarea>
              </div>

            </div>

            <div class="card">
              <div class="card-title green">To-Do für Folgeschicht</div>
              <textarea id="todo_${a}" placeholder="Was muss die nächste Schicht erledigen?"></textarea>
            </div>

            <div class="card">
              <div class="card-title">Stationen & Besonderheiten</div>
              <label>Auffälligkeiten an den Stationen</label>
              <textarea id="stationen_${a}" placeholder="Abwickeln, Schweißen, Hot Wash, U-Clean..."></textarea>
              <label>Defekte & technische Störungen</label>
              <textarea id="defekte_${a}" placeholder="Was war defekt?"></textarea>
              <label>Fehlendes Werkzeug / Materialien / KVP</label>
              <textarea id="material_${a}" placeholder="Bestellungen, fehlende Teile, Verbesserungen"></textarea>
            </div>

          </div>
        `);
      });
    </script>

    <button type="button" id="submitBtn" class="btn-submit" onclick="generateShiftPDF()">
      PDF Erstellen & Öffnen
    </button>
    <button type="button" class="btn-reset" onclick="openResetModal()">
      Neues Protokoll starten / Zurückstellen
    </button>
  </form>
</div>

<!-- ARCHIV MODAL -->
<div id="archiveModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Schichtbuch-Archiv</div>
      <button class="modal-close" onclick="closeArchiveModal()">&times;</button>
    </div>
    <div class="archive-list" id="archiveList">
      <!-- Dynamische Liste -->
    </div>
  </div>
</div>

<!-- RESET MODAL -->
<div id="resetModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Formular zurückstellen</div>
      <button class="modal-close" onclick="closeResetModal()">&times;</button>
    </div>
    <p style="font-size:0.9rem; color:var(--text-main); margin-bottom:10px;">
      Möchtest du diese Schicht im Archiv speichern oder das Formular einfach leeren, ohne zu archivieren?
    </p>
    <div class="confirm-actions">
      <button class="btn-modal-action btn-modal-primary" onclick="confirmReset(true)">
        💾 Archivieren & Neues Protokoll starten
      </button>
      <button class="btn-modal-action btn-modal-secondary" onclick="confirmReset(false)">
        🗑️ Nicht archivieren (Nur zurückstellen)
      </button>
      <button class="btn-modal-action btn-modal-cancel" onclick="closeResetModal()">
        Abbrechen
      </button>
    </div>
  </div>
</div>

<div id="pdf-container"></div>

<script>
  // Aktuell geladener Archiv-Eintrag (null = neues Protokoll)
  let currentEditingArchiveId = null;

  // Initiales Datum
  document.getElementById('datum').valueAsDate = new Date();

  function showAnlage(anl, event) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.anlage-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`anlage-${anl}`).classList.add('active');
  }

  const formElement = id => document.getElementById(id);

  function getCurrentFormData() {
    const data = {};
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(el => {
      if (el.id) data[el.id] = el.value;
    });
    return data;
  }

  function saveToLocalStorage() {
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(el => {
      if (el.id) {
        localStorage.setItem('schichtbuch_' + el.id, el.value);
      }
    });
    if (currentEditingArchiveId) {
      localStorage.setItem('schichtbuch_current_editing_id', currentEditingArchiveId);
    } else {
      localStorage.removeItem('schichtbuch_current_editing_id');
    }
  }

  function loadFromLocalStorage() {
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(el => {
      if (el.id) {
        const val = localStorage.getItem('schichtbuch_' + el.id);
        if (val !== null) el.value = val;
      }
    });
    if (!localStorage.getItem('schichtbuch_datum')) {
      document.getElementById('datum').valueAsDate = new Date();
    }

    const savedEditingId = localStorage.getItem('schichtbuch_current_editing_id');
    if (savedEditingId) {
      currentEditingArchiveId = parseInt(savedEditingId, 10);
      updateEditBanner();
    }
  }

  function updateEditBanner() {
    const banner = document.getElementById('editBanner');
    if (currentEditingArchiveId) {
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }
  }

  function cancelEditMode() {
    currentEditingArchiveId = null;
    localStorage.removeItem('schichtbuch_current_editing_id');
    updateEditBanner();
    alert("Bearbeitungsmodus aufgehoben.");
  }

  // ARCHIV LOGIK
  function archiveCurrentState() {
    let archive = [];
    try {
      archive = JSON.parse(localStorage.getItem('schichtbuch_archive')) || [];
    } catch (e) { archive = []; }

    const currentData = getCurrentFormData();
    
    const datum = currentData.datum || new Date().toISOString().split('T')[0];
    const schicht = currentData.schicht || 'Unbekannt';
    const bediener = currentData.bediener || 'Kein Name';

    // Wenn wir einen Eintrag bearbeiten, überschreiben wir ihn!
    if (currentEditingArchiveId) {
      const index = archive.findIndex(e => e.id === currentEditingArchiveId);
      if (index !== -1) {
        archive[index] = {
          id: currentEditingArchiveId,
          timestamp: new Date().toLocaleString('de-DE') + ' (Bearbeitet)',
          datum: datum,
          schicht: schicht,
          bediener: bediener,
          formData: currentData
        };
      } else {
        currentEditingArchiveId = Date.now();
        archive.unshift({
          id: currentEditingArchiveId,
          timestamp: new Date().toLocaleString('de-DE'),
          datum: datum,
          schicht: schicht,
          bediener: bediener,
          formData: currentData
        });
      }
    } else {
      const newId = Date.now();
      const entry = {
        id: newId,
        timestamp: new Date().toLocaleString('de-DE'),
        datum: datum,
        schicht: schicht,
        bediener: bediener,
        formData: currentData
      };
      archive.unshift(entry);
    }

    // Maximal 50 Einträge behalten
    if (archive.length > 50) {
      archive = archive.slice(0, 50);
    }

    localStorage.setItem('schichtbuch_archive', JSON.stringify(archive));
  }

  function openArchiveModal() {
    const modal = document.getElementById('archiveModal');
    const list = document.getElementById('archiveList');
    list.innerHTML = '';

    let archive = [];
    try {
      archive = JSON.parse(localStorage.getItem('schichtbuch_archive')) || [];
    } catch (e) { archive = []; }

    if (archive.length === 0) {
      list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Keine archivierten Schichten vorhanden.</div>';
    } else {
      archive.forEach((item) => {
        const el = document.createElement('div');
        el.className = 'archive-item';
        el.innerHTML = `
          <div class="archive-info">
            <div class="archive-date">${item.datum} - ${item.schicht}</div>
            <div style="color:var(--text-muted); font-size:0.75rem;">Bediener: ${item.bediener}</div>
            <div style="color:#6b7280; font-size:0.7rem;">Archiviert: ${item.timestamp}</div>
          </div>
          <button class="btn-load" onclick="loadArchiveEntry(${item.id})">Laden & Bearbeiten</button>
        `;
        list.appendChild(el);
      });
    }

    modal.style.display = 'flex';
  }

  function closeArchiveModal() {
    document.getElementById('archiveModal').style.display = 'none';
  }

  function openResetModal() {
    document.getElementById('resetModal').style.display = 'flex';
  }

  function closeResetModal() {
    document.getElementById('resetModal').style.display = 'none';
  }

  function confirmReset(shouldArchive) {
    closeResetModal();

    if (shouldArchive) {
      archiveCurrentState();
    }

    const savedArtAkt = {};
    const savedArtFolge = {};

    ['801', '802', '803', '804'].forEach(a => {
      savedArtAkt[a] = formElement(`art_akt_${a}`).value;
      savedArtFolge[a] = formElement(`art_folge_${a}`).value;
    });

    // Bearbeitungsmodus zurücksetzen für die neue Schicht
    currentEditingArchiveId = null;

    // Formular-LocalStorage löschen (Archiv behalten)
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith('schichtbuch_') && key !== 'schichtbuch_archive') {
        localStorage.removeItem(key);
      }
    });

    // Formular zurücksetzen
    document.getElementById('schichtForm').reset();
    document.getElementById('datum').valueAsDate = new Date();

    // Artikelnummern wieder einfügen
    ['801', '802', '803', '804'].forEach(a => {
      formElement(`art_akt_${a}`).value = savedArtAkt[a] || '';
      formElement(`art_folge_${a}`).value = savedArtFolge[a] || '';
    });

    saveToLocalStorage();
    updateEditBanner();

    if (shouldArchive) {
      alert("Schicht wurde archiviert und das Formular für die nächste Schicht zurückgestellt!");
    } else {
      alert("Formular wurde zurückgestellt (ohne zu archivieren).");
    }
  }

  function loadArchiveEntry(id) {
    let archive = [];
    try {
      archive = JSON.parse(localStorage.getItem('schichtbuch_archive')) || [];
    } catch (e) { archive = []; }

    const entry = archive.find(e => e.id === id);
    if (entry && entry.formData) {
      if (confirm(`Möchtest du die Schicht vom ${entry.datum} (${entry.schicht}) laden? Alle Änderungen überschreiben diesen Eintrag im Archiv.`)) {
        Object.keys(entry.formData).forEach(key => {
          const field = document.getElementById(key);
          if (field) {
            field.value = entry.formData[key];
          }
        });
        
        currentEditingArchiveId = id;
        saveToLocalStorage();
        updateEditBanner();
        closeArchiveModal();
        alert("Eintrag geladen. Wenn du nun Änderungen vornimmst und archivierst/zurückstellst, wird dieser Eintrag aktualisiert.");
      }
    }
  }

  // Event Listener für Auto-Save anhängen
  document.addEventListener('DOMContentLoaded', () => {
    loadFromLocalStorage();
    document.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('input', () => {
        saveToLocalStorage();
        if (currentEditingArchiveId) archiveCurrentState();
      });
      el.addEventListener('change', () => {
        saveToLocalStorage();
        if (currentEditingArchiveId) archiveCurrentState();
      });
    });
  });

  async function generateShiftPDF() {
    const btn = document.getElementById('submitBtn');
    btn.innerText = "Erstelle Schichtblatt...";
    btn.style.opacity = "0.5";

    // Beim Generieren des PDFs auch sicherstellen, dass Änderungen im Archiv gesichert sind
    archiveCurrentState();

    const datumVal = formElement('datum').value || '-';
    const schichtVal = formElement('schicht').value;
    const bedienerVal = formElement('bediener').value || '-';

    const pdfContainer = document.getElementById('pdf-container');
    pdfContainer.innerHTML = '';

    let anlagenHTML = '';
    ['801', '802', '803', '804'].forEach(a => {
      const gutMenge = formElement(`gut_menge_${a}`).value || '0';
      const artAkt = formElement(`art_akt_${a}`).value || '-';
      const artFolge = formElement(`art_folge_${a}`).value || '-';
      const todo = formElement(`todo_${a}`).value || '-';
      const stat = formElement(`stationen_${a}`).value || '-';
      const def = formElement(`defekte_${a}`).value || '-';
      const mat = formElement(`material_${a}`).value || '-';

      // Fehler 1 - 3 zusammenbauen
      let ausschussBlockHTML = '';
      for (let i = 1; i <= 3; i++) {
        const menge = formElement(`ausschuss_menge_${a}_${i}`).value || '0';
        const grund = formElement(`ausschuss_grund_${a}_${i}`).value;
        const det = formElement(`ausschuss_details_${a}_${i}`).value;

        if ((menge !== '0' && menge !== '') || grund !== 'Kein Ausschuss' || det !== '') {
          ausschussBlockHTML += `
            <div style="margin-bottom: 3px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 2px;">
              <b>Menge:</b> <span style="color:#dc2626; font-weight:bold;">${menge}</span> | <b>Ursache:</b> ${grund}
              ${det ? `<br><i>${det}</i>` : ''}
            </div>
          `;
        }
      }

      if (!ausschussBlockHTML) {
        ausschussBlockHTML = '<div class="pdf-val">Kein Ausschuss</div>';
      }

      anlagenHTML += `
        <div class="pdf-anlage-card">
          <div class="pdf-anlage-title">ANLAGE ${a}</div>
          <div class="pdf-card-body">
            
            <div class="pdf-block">
              <div class="pdf-block-title green">Produktion</div>
              <div class="pdf-val"><b>Gut-Menge:</b> ${gutMenge}</div>
              <div class="pdf-val"><b>Artikel-Nr:</b> ${artAkt}</div>
              <div class="pdf-val"><b>Folge-Art.:</b> ${artFolge}</div>
            </div>

            <div class="pdf-block">
              <div class="pdf-block-title red">Ausschuss & Ursachen</div>
              ${ausschussBlockHTML}
            </div>

            <div class="pdf-block">
              <div class="pdf-block-title green">To-Do Folgeschicht</div>
              <div class="pdf-val">${todo}</div>
            </div>

            <div class="pdf-block" style="flex: 1;">
              <div class="pdf-block-title">Stationen & Störungen</div>
              <div class="pdf-val"><b>Stationen:</b> ${stat}</div>
              <div class="pdf-val"><b>Defekte:</b> ${def}</div>
              <div class="pdf-val"><b>Material/KVP:</b> ${mat}</div>
            </div>

          </div>
        </div>
      `;
    });

    pdfContainer.innerHTML = `
      <div class="pdf-page" id="pdf-shift-page">
        <div class="pdf-header">
          <div>
            <h2>SCHICHTBUCH PROTOKOLL</h2>
            <div style="font-size: 8.5pt; opacity: 0.8;">Bandgalvanik Gesamtbericht</div>
          </div>
          <div class="badge">${schichtVal.toUpperCase()}</div>
        </div>

        <div class="pdf-meta-grid">
          <div class="pdf-meta-item">
            <label>Datum</label>
            <div>${datumVal}</div>
          </div>
          <div class="pdf-meta-item">
            <label>Schicht</label>
            <div>${schichtVal}</div>
          </div>
          <div class="pdf-meta-item">
            <label>Schichtführer / Bediener</label>
            <div>${bedienerVal}</div>
          </div>
        </div>

        <div class="pdf-anlagen-grid">
          ${anlagenHTML}
        </div>

        <div class="pdf-footer">
          <span>Schichtbuch Protokoll - Bandgalvanik</span>
          <span>1 Blatt pro Schicht</span>
        </div>
      </div>
    `;

    // Canvas & PDF Rendern (A4 Querformat)
    const pageEl = document.getElementById('pdf-shift-page');
    const canvas = await html2canvas(pageEl, {
      scale: 2,
      useCORS: true,
      logging: false
    });

    const imgData = canvas.toDataURL('image/jpeg', 0.98);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('landscape', 'pt', 'a4');

    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = pdf.internal.pageSize.getHeight();

    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);

    const pdfBlob = pdf.output('blob');
    const pdfUrl = URL.createObjectURL(pdfBlob);

    btn.innerText = "PDF Erstellen & Öffnen";
    btn.style.opacity = "1";

    window.location.href = pdfUrl;
  }
</script>

</body>
