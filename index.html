<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Morgenrunde</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #f4f6f9;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
  }
  header {
    background: #003366;
    color: white;
    padding: 10px 12px 8px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 17px;
    margin: 0 0 6px 0;
  }
  .meta-row {
    display: flex;
    gap: 6px;
  }
  .meta-row input {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    padding: 8px 8px;
    border-radius: 5px;
    border: none;
  }
  .progress {
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: #4fc3f7;
    transition: width .3s;
  }

  main { padding: 8px 8px 30px; }

  .section {
    background: white;
    border-radius: 8px;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px;
    cursor: pointer;
  }
  .section-head .left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14.5px;
  }
  .num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #003366;
    color: white;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .num.done { background: #2e7d32; }
  .chevron {
    font-size: 12px;
    color: #888;
    transition: transform .2s;
  }
  .section.open .chevron { transform: rotate(90deg); }

  .section-body {
    display: none;
    padding: 0 10px 10px;
  }
  .section.open .section-body { display: block; }

  textarea {
    width: 100%;
    min-height: 64px;
    font-size: 16px; /* verhindert Auto-Zoom bei Fokus auf iOS */
    padding: 8px;
    border: 1px solid #ccd5e0;
    border-radius: 6px;
    font-family: inherit;
    resize: vertical;
  }
  textarea.flash {
    animation: flashbg 1.1s ease;
  }
  @keyframes flashbg {
    0% { background: #fff59d; }
    100% { background: white; }
  }

  .btn-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .btn {
    flex: 1;
    font-size: 13px;
    padding: 8px 4px;
    border-radius: 6px;
    border: none;
    background: #e8eef5;
    color: #003366;
    font-weight: 600;
  }
  .btn.correct { background: #003366; color: white; }
  .btn.photo { background: #2e7d32; color: white; }
  .btn:active { opacity: 0.75; }

  .photo-status {
    display: none;
    font-size: 12px;
    color: #555;
    margin-top: 6px;
    background: #f4f6f9;
    border-radius: 6px;
    padding: 6px 8px;
  }
  .photo-status.busy { color: #b06d00; }
  .photo-status.ok { color: #2e7d32; }
  .photo-status.err { color: #c62828; }

  .status-toggle {
    display: flex;
    gap: 10px;
    margin: 6px 0;
  }
  .status-toggle button {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccd5e0;
    background: white;
    font-size: 13px;
    font-weight: 600;
  }
  .status-toggle button.active-yes { background: #2e7d32; color: white; border-color: #2e7d32; }
  .status-toggle button.active-no { background: #c62828; color: white; border-color: #c62828; }

  .hint {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: #999;
    padding: 10px;
  }

  .fab {
    position: fixed;
    bottom: 14px;
    right: 14px;
    background: #003366;
    color: white;
    border: none;
    border-radius: 50%;
    width: 46px; height: 46px;
    font-size: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .print-trigger {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #4fc3f7;
    color: #00293d;
    font-weight: 700;
    font-size: 14px;
  }
  .print-trigger:active { opacity: 0.8; }

  .glossary-trigger {
    position: absolute;
    top: 10px;
    right: 12px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    border-radius: 50%;
    width: 30px; height: 30px;
    font-size: 15px;
  }
  header { position: sticky; }

  /* Glossar-Panel */
  .glossary-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 50;
    align-items: flex-end;
  }
  .glossary-overlay.open { display: flex; }
  .glossary-panel {
    background: white;
    width: 100%;
    max-height: 85vh;
    border-radius: 14px 14px 0 0;
    padding: 14px 14px 20px;
    overflow-y: auto;
  }
  .glossary-panel h2 {
    font-size: 16px;
    margin: 0 0 4px;
    color: #003366;
  }
  .glossary-panel .sub {
    font-size: 12px;
    color: #777;
    margin-bottom: 10px;
  }
  .glossary-add {
    background: #f4f6f9;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .glossary-add label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: #003366;
    margin: 6px 0 2px;
  }
  .glossary-add input {
    width: 100%;
    font-size: 16px;
    padding: 7px 8px;
    border: 1px solid #ccd5e0;
    border-radius: 6px;
  }
  .glossary-add button {
    width: 100%;
    margin-top: 10px;
    padding: 9px;
    border: none;
    border-radius: 6px;
    background: #003366;
    color: white;
    font-weight: 700;
    font-size: 14px;
  }
  .glossary-list-title {
    font-size: 12.5px;
    font-weight: 700;
    color: #003366;
    margin: 10px 0 4px;
  }
  .glossary-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 8px;
    border-bottom: 1px solid #eee;
    font-size: 13.5px;
  }
  .glossary-item .txt { flex: 1; }
  .glossary-item .txt small { display:block; color:#999; font-size: 11px; }
  .glossary-item button {
    background: #fdecea;
    color: #c62828;
    border: none;
    border-radius: 5px;
    width: 26px; height: 26px;
    font-size: 14px;
  }
  .glossary-close {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 9px;
    border: none;
    border-radius: 6px;
    background: #e8eef5;
    color: #003366;
    font-weight: 600;
  }
  .empty-hint { font-size: 12.5px; color: #999; padding: 6px 0; }

  /* Diese Elemente sind nur beim Drucken sichtbar */
  .print-box, .print-status, .print-meta {
    display: none;
  }

  @media print {
    body { background: white; }
    header { background: white !important; color: #003366 !important; position: static; box-shadow: none; }
    header h1 { color: #003366; }
    .progress, .print-trigger, .meta-row, .fab, .btn-row, .hint, .chevron, textarea, .status-toggle, .photo-status, input[type="file"] {
      display: none !important;
    }
    .section {
      box-shadow: none;
      border: 1px solid #ccc;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      margin-bottom: 8px;
    }
    .section-body { display: block !important; padding-top: 4px; }
    .print-meta {
      display: block !important;
      font-size: 12px;
      color: #333;
      margin: 4px 0 10px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 6px;
    }
    .print-status {
      display: block !important;
      font-weight: 700;
      font-size: 12.5px;
      margin-bottom: 4px;
    }
    .print-box {
      display: block !important;
      white-space: pre-wrap;
      font-size: 12.5px;
      line-height: 1.4;
      color: #222;
    }
    footer { display: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Morgenrunde – Protokoll</h1>
  <button type="button" class="glossary-trigger" id="glossaryBtn" title="Fachbegriffe verwalten">📖</button>
  <div class="meta-row">
    <input type="date" id="datum">
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <button type="button" class="print-trigger" id="printBtn">🖨️ Übersichtliche PDF erzeugen / Drucken</button>
  <div class="print-meta" id="printMeta"></div>
</header>

<main id="sections"></main>

<footer>Zum Diktieren Mikrofon-Taste der iPhone-Tastatur nutzen · danach „Korrigieren" antippen</footer>

<button class="fab" id="expandAllBtn" title="Alle auf/zu">⇅</button>

<div class="glossary-overlay" id="glossaryOverlay">
  <div class="glossary-panel">
    <h2>📖 Fachbegriffe</h2>
    <div class="sub">Begriffe, die beim Diktieren automatisch korrigiert werden. Eigene Begriffe könnt ihr unten ergänzen.</div>

    <div class="glossary-add">
      <label>Wird oft falsch verstanden als (optional)</label>
      <input type="text" id="newWrong" placeholder="z. B. „Zinn Anode getrennt gesprochen“">
      <label>Korrekter Fachbegriff</label>
      <input type="text" id="newCorrect" placeholder="z. B. Zinnanode">
      <button type="button" id="addTermBtn">+ Begriff hinzufügen</button>
    </div>

    <div class="glossary-list-title">Eigene Begriffe</div>
    <div id="customTermsList"></div>

    <div class="glossary-list-title">Vordefinierte Fachbegriffe (Galvanik)</div>
    <div id="builtinTermsList"></div>

    <button type="button" class="glossary-close" id="glossaryCloseBtn">Schließen</button>
  </div>
</div>

<script>
// ---------------------------------------------------------
// 1) INHALT DER ABSCHNITTE
// ---------------------------------------------------------
const sections = [
  { title: "Arbeitssicherheit / Unfälle", placeholder: "Unfälle, Beinaheunfälle, Sicherheitsmaßnahmen..." },
  { title: "Umweltthemen", placeholder: "Umweltvorkommnisse, Abfall, Emissionen..." },
  { title: "Produktion Anlagen 801 / 802 / 803 / 804", placeholder: "Mengen, Status, Störungen je Anlage...", withPhoto: true },
  { title: "Prozessparameter eingehalten?", placeholder: "Falls Abweichung: Anlage, Ursache, Maßnahme...", withStatus: true },
  { title: "Folgeauftrag", placeholder: "Nächster Auftrag / Umrüstung..." },
  { title: "Wochenthemen", placeholder: "Termine, besondere Themen der Woche..." },
  { title: "Labor", placeholder: "Analysenergebnisse, offene Proben..." },
  { title: "SES (Instandhaltung)", placeholder: "Offene Störungen, Reparaturen, Wartungen..." },
  { title: "Allgemein", placeholder: "Sonstiges, das nicht in die anderen Punkte passt..." },
];

// ---------------------------------------------------------
// 2) FACHBEGRIFF-KORREKTUR
//    a) feste Phrasen-Ersetzungen (häufige Diktier-Fehler)
//    b) unscharfer Abgleich (Levenshtein) gegen Fachwortliste
//    -> Liste unten einfach erweitern, wenn ihr weitere
//       Begriffe/Anlagen/Abkürzungen ergänzen wollt.
// ---------------------------------------------------------
const phraseFixes = [
  [/\banlage\s*acht\s*null\s*eins\b/gi, "Anlage 801"],
  [/\banlage\s*acht\s*null\s*zwei\b/gi, "Anlage 802"],
  [/\banlage\s*acht\s*null\s*drei\b/gi, "Anlage 803"],
  [/\banlage\s*acht\s*null\s*vier\b/gi, "Anlage 804"],
  [/\bacht\s*null\s*eins\b/gi, "801"],
  [/\bacht\s*null\s*zwei\b/gi, "802"],
  [/\bacht\s*null\s*drei\b/gi, "803"],
  [/\bacht\s*null\s*vier\b/gi, "804"],
  [/\bacht\s?hundert\s?eins\b/gi, "801"],
  [/\bacht\s?hundert\s?zwei\b/gi, "802"],
  [/\bacht\s?hundert\s?drei\b/gi, "803"],
  [/\bacht\s?hundert\s?vier\b/gi, "804"],
  [/\bes\s*es\b/gi, "SES"],
  [/\bs\.?\s*e\.?\s*s\.?\b/gi, "SES"],
  [/\bin\s?stand\s?haltung\b/gi, "Instandhaltung"],
  [/\bprozess\s?parameter\b/gi, "Prozessparameter"],
  [/\bfolge\s?auftrag\b/gi, "Folgeauftrag"],
  [/\bwochen\s?themen\b/gi, "Wochenthemen"],
  [/\barbeits\s?sicherheit\b/gi, "Arbeitssicherheit"],
  [/\bumwelt\s?themen\b/gi, "Umweltthemen"],
  [/\bbeinahe\s?unfall\b/gi, "Beinaheunfall"],
  [/\bp\.?\s*s\.?\s*a\.?\b/gi, "PSA"],
  [/\bgefahr\s?stoff\b/gi, "Gefahrstoff"],
  [/\bgrenz\s?wert\b/gi, "Grenzwert"],

  // --- Galvanik-Fachbegriffe (aus Equipment-Übersicht) ---
  [/\btauch\s?tief\s?zelle\b/gi, "Tauchtiefzelle"],
  [/\btauch\s?tief\b/gi, "Tauchtief"],
  [/\bnickel\s?tauch\s?tief\s?zelle\b/gi, "Nickeltauchtiefzelle"],
  [/\bedelmetall\s?tauch\s?tief\s?zelle\b/gi, "Edelmetall-Tauchtiefzelle"],
  [/\bzinn\s?tauch\s?tief\s?zelle\b/gi, "Zinntauchtiefzelle"],
  [/\btauch\s?tief\s?zellen\s?anode\b/gi, "Tauchtiefzellenanode"],
  [/\banoden\s?säcke\b/gi, "Anodensäcke"],
  [/\banoden\s?körbe\b/gi, "Anodenkörbe"],
  [/\banoden\s?korb\b/gi, "Anodenkorb"],
  [/\bnickel\s?anoden\b/gi, "Nickelanoden"],
  [/\bzinn\s?anoden\b/gi, "Zinnanoden"],
  [/\bzinn\s?anode\b/gi, "Zinnanode"],
  [/\bzinn\s?korb\s?erhöhung\b/gi, "Zinnkorberhöhung"],
  [/\bboden\s?leiste(n)?\b/gi, (m,p1)=> "Bodenleiste"+(p1?"n":"")],
  [/\bboden\s?führung\b/gi, "Bodenführung"],
  [/\bboden\s?rolle\b/gi, "Bodenrolle"],
  [/\bnickel\s?top\s?shield\s?halter\b/gi, "NickelTopShieldhalter"],
  [/\bnickel\s?top\s?shield\b/gi, "NickelTopShield"],
  [/\bcenter\s?port\s?adapter\b/gi, "CenterPort Adapter"],
  [/\bcenter\s?port\b/gi, "CenterPort"],
  [/\bjet\s?base\b/gi, "Jet Base"],
  [/\bjet\s?zelle\b/gi, "Jet Zelle"],
  [/\btop\s?führung\b/gi, "Top Führung"],
  [/\brollen\s?führung\s?jet\b/gi, "Rollenführung Jet"],
  [/\bmylar\s?halterung\b/gi, "Mylarhalterung"],
  [/\bstab\s?anoden\b/gi, "Stabanoden"],
  [/\bspe\s?base\b/gi, "SPE Base"],
  [/\bjoe\s?base\b/gi, "Joe Base"],
  [/\bspot\s?punkt\b/gi, "Spot Punkt"],
  [/\bstripe\s?streifen\b/gi, "Stripe Streifen"],
  [/\bsilikon\s?einsatz\b/gi, "Silikoneinsatz"],
  [/\bwheel\s?anode\b/gi, "Wheelanode"],
  [/\bumlenk\s?rollen\b/gi, "Umlenkrollen"],
  [/\bcross\s?flow\s?zelle\b/gi, "Crossflowzelle"],
  [/\bcross\s?flow\b/gi, "Crossflow"],
  [/\bein\s?auslauf\s?wehr\b/gi, "Ein-Auslaufwehr"],
  [/\bbürsten\s?kontaktierung\b/gi, "Bürstenkontaktierung"],
  [/\bbürsten\s?halter\b/gi, "Bürstenhalter"],
  [/\bspe\s?vertikal\s?rollen\b/gi, "SPE-Vertikalrollen"],
  [/\bvertikal\s?rolle(n)?\b/gi, (m,p1)=> "Vertikalrolle"+(p1?"n":"")],
  [/\bspe\s?boden\s?rolle\b/gi, "SPE-Bodenrolle"],
  [/\bte\s?vertikal\s?rolle\b/gi, "TE-Vertikalrolle"],
  [/\bband\s?halter\b/gi, "Bandhalter"],

  // --- Chemie / Prozessschritte ---
  [/\bzinn\s?aktivierung\b/gi, "Zinn-Aktivierung"],
  [/\bnickel\s?aktivierung\b/gi, "Nickel-Aktivierung"],
  [/\bgold\s?aktivierung\b/gi, "Gold-Aktivierung"],
  [/\bpalladium\s?strike\b/gi, "Palladium-Strike"],
  [/\bvor\s?behandlung\b/gi, "Vorbehandlung"],
  [/\be\s?clean\b/gi, "E-Clean"],
  [/\bu\s?clean\b/gi, "U-Clean"],
  [/\bu\s?turm\b/gi, "U-Turm"],
  [/\bhot\s?wash\b/gi, "Hotwash"],
];

// Fachwörter für unscharfen Abgleich (kanonische Schreibweise)
const builtinGlossary = [
  "Arbeitssicherheit","Unfälle","Beinaheunfall","Umweltthemen","Emission",
  "Leckage","Gefahrstoff","Grenzwert","Prozessparameter","Sollwert","Istwert",
  "Folgeauftrag","Umrüstung","Wochenthemen","Labor","Analysenwert","Charge",
  "Freigabe","SES","Instandhaltung","Störung","Wartung","Kalibrierung",
  "Havarie","Schicht","PSA","Anlage","801","802","803","804",
  // --- Galvanik-Fachbegriffe ---
  "Tauchtief","Tauchtiefzelle","Nickeltauchtiefzelle","Edelmetall-Tauchtiefzelle",
  "Zinntauchtiefzelle","Tauchtiefzellenanode","Anodensäcke","Anodenkörbe",
  "Anodenkorb","Nickelanoden","Zinnanoden","Zinnanode","Zinnkorberhöhung",
  "Bodenleiste","Bodenleisten","Bodenführung","Bodenrolle",
  "NickelTopShield","NickelTopShieldhalter","CenterPort","CenterPort Adapter",
  "Jet","Jet Base","Jet Zelle","Top Führung","Rollenführung Jet",
  "Mylar","Mylarhalterung","Stabanoden","Damm",
  "SPE Base","Joe Base","Wheel","Spot Punkt","Stripe Streifen",
  "Silikoneinsatz","Riemen","Wheelanode","Umlenkrollen",
  "Crossflow","Crossflowzelle","Ein-Auslaufwehr","Exzenter","Wehr","Füße",
  "Bürstenkontaktierung","Bürstenhalter","Kontaktierung","Führungen",
  "SPE-Vertikalrollen","Vertikalrolle","Vertikalrollen","SPE-Bodenrolle",
  "TE-Vertikalrolle","Bandhalter",
  // --- Chemie / Prozessschritte ---
  "Zinn","Zinn-Aktivierung","Nickel","Nickel-Aktivierung","Gold","Gold-Aktivierung",
  "Palladium","Palladium-Strike","Vorbehandlung","E-Clean","U-Clean","U-Turm",
  "Speicher","Hotwash","Stripper"
];

// eigene, vom Nutzer ergänzte Begriffe (localStorage, mit Fallback)
let customTerms = [];
try {
  customTerms = JSON.parse(localStorage.getItem("morgenrunde_custom_terms") || "[]");
} catch (e) { customTerms = []; }

function saveCustomTerms() {
  try { localStorage.setItem("morgenrunde_custom_terms", JSON.stringify(customTerms)); }
  catch (e) { /* Speicher evtl. nicht verfügbar - Begriffe gelten dann nur für diese Sitzung */ }
}

function buildCustomPhraseFixes() {
  return customTerms
    .filter(t => t.wrong && t.wrong.trim())
    .map(t => [new RegExp("\\b" + t.wrong.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s?") + "\\b", "gi"), t.correct]);
}

function currentGlossary() {
  return builtinGlossary.concat(customTerms.map(t => t.correct).filter(Boolean));
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for (let i=0;i<=m;i++) dp[i][0]=i;
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++){
    for (let j=1;j<=n;j++){
      const cost = a[i-1].toLowerCase() === b[j-1].toLowerCase() ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i-1][j] + 1,
        dp[i][j-1] + 1,
        dp[i-1][j-1] + cost
      );
    }
  }
  return dp[m][n];
}

function fuzzyFixWord(word) {
  const stripped = word.replace(/[.,;:!?()]/g, "");
  if (stripped.length < 4) return word; // zu kurze Wörter nicht anfassen
  let best = null, bestDist = Infinity;
  for (const term of currentGlossary()) {
    if (Math.abs(term.length - stripped.length) > 3) continue;
    const d = levenshtein(stripped.toLowerCase(), term.toLowerCase());
    if (d < bestDist) { bestDist = d; best = term; }
  }
  const threshold = stripped.length <= 6 ? 1 : 2;
  if (best && bestDist > 0 && bestDist <= threshold && best.toLowerCase() !== stripped.toLowerCase()) {
    return word.replace(stripped, best);
  }
  return word;
}

function correctText(text) {
  let t = text;
  buildCustomPhraseFixes().forEach(([regex, replacement]) => { t = t.replace(regex, replacement); });
  phraseFixes.forEach(([regex, replacement]) => { t = t.replace(regex, replacement); });
  t = t.split(/(\s+)/).map(tok => /\s+/.test(tok) ? tok : fuzzyFixWord(tok)).join("");
  return t;
}

// ---------------------------------------------------------
// 3) RENDERING
// ---------------------------------------------------------
const datumInput = document.getElementById("datum");
if (!datumInput.value) {
  const today = new Date();
  const pad = n => String(n).padStart(2, "0");
  datumInput.value = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
}

const container = document.getElementById("sections");

sections.forEach((s, i) => {
  const div = document.createElement("div");
  div.className = "section" + (i === 0 ? " open" : "");
  div.innerHTML = `
    <div class="section-head" data-idx="${i}">
      <div class="left">
        <div class="num" id="num-${i}">${i+1}</div>
        <span>${s.title}</span>
      </div>
      <span class="chevron">▶</span>
    </div>
    <div class="section-body">
      ${s.withStatus ? `
      <div class="status-toggle">
        <button type="button" data-status="ja" data-idx="${i}">Ja</button>
        <button type="button" data-status="nein" data-idx="${i}">Nein</button>
      </div>
      <div class="print-status" id="pstatus-${i}"></div>` : ``}
      <textarea id="ta-${i}" placeholder="${s.placeholder}"></textarea>
      <div class="print-box" id="pbox-${i}"></div>
      <div class="btn-row">
        <button type="button" class="btn correct" data-idx="${i}">✓ Korrigieren</button>
        ${s.withPhoto ? `<button type="button" class="btn photo" data-photo="${i}">📷 Foto → Text</button>` : ``}
        <button type="button" class="btn" data-clear="${i}">Leeren</button>
      </div>
      ${s.withPhoto ? `
      <input type="file" accept="image/*" multiple id="photo-${i}" style="display:none">
      <div class="photo-status" id="photostatus-${i}"></div>` : ``}
      <div class="hint">${s.withPhoto ? `Tipp: Mikro auf der Tastatur zum Diktieren nutzen, danach „Korrigieren" antippen. Foto → Text: Kamera oder Fotos-App wählen, mehrere Bilder (z. B. je Anlage) möglich.` : `Tipp: Mikro auf der Tastatur zum Diktieren nutzen, danach „Korrigieren" antippen.`}</div>
    </div>
  `;
  container.appendChild(div);
});

// Auf-/Zuklappen
container.addEventListener("click", (e) => {
  const head = e.target.closest(".section-head");
  if (head) {
    head.closest(".section").classList.toggle("open");
    return;
  }
  const correctBtn = e.target.closest(".btn.correct");
  if (correctBtn) {
    const idx = correctBtn.dataset.idx;
    const ta = document.getElementById("ta-" + idx);
    ta.value = correctText(ta.value);
    ta.classList.remove("flash");
    void ta.offsetWidth; // reflow, damit Animation neu startet
    ta.classList.add("flash");
    updateProgress();
    return;
  }
  const photoBtn = e.target.closest(".btn.photo");
  if (photoBtn) {
    document.getElementById("photo-" + photoBtn.dataset.photo).click();
    return;
  }
  const clearBtn = e.target.closest("[data-clear]");
  if (clearBtn) {
    const idx = clearBtn.dataset.clear;
    const title = sections[idx].title;
    if (confirm(`Wollen Sie „${title}" wirklich zurücksetzen?`)) {
      document.getElementById("ta-" + idx).value = "";
      const statusEl = document.getElementById("photostatus-" + idx);
      if (statusEl) { statusEl.textContent = ""; statusEl.style.display = "none"; }
      const group = document.querySelector(`.status-toggle button[data-idx="${idx}"]`)?.parentElement;
      if (group) group.querySelectorAll("button").forEach(b => b.classList.remove("active-yes","active-no"));
      updateProgress();
    }
    return;
  }
  const statusBtn = e.target.closest(".status-toggle button");
  if (statusBtn) {
    const idx = statusBtn.dataset.idx;
    const group = statusBtn.parentElement.querySelectorAll("button");
    group.forEach(b => b.classList.remove("active-yes","active-no"));
    if (statusBtn.dataset.status === "ja") statusBtn.classList.add("active-yes");
    else statusBtn.classList.add("active-no");
    updateProgress();
    return;
  }
});

// Fortschrittsanzeige = wie viele Abschnitte befüllt sind
function updateProgress() {
  let filled = 0;
  sections.forEach((s, i) => {
    const ta = document.getElementById("ta-" + i);
    const hasStatus = document.querySelector(`.status-toggle button.active-yes[data-idx="${i}"], .status-toggle button.active-no[data-idx="${i}"]`);
    const isFilled = ta.value.trim().length > 0 || hasStatus;
    document.getElementById("num-" + i).classList.toggle("done", isFilled);
    if (isFilled) filled++;
  });
  const pct = Math.round((filled / sections.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
}
container.addEventListener("input", (e) => {
  if (e.target.tagName === "TEXTAREA") updateProgress();
});

// ---------------------------------------------------------
// FOTO → TEXT (OCR)
//    Kamera direkt öffnen, Text/Zahlen im Bild erkennen
//    (z. B. Zählerstände, Anzeigen) und in das Feld einfügen.
//    Nutzt Tesseract.js, wird erst bei Bedarf nachgeladen
//    (benötigt dafür einmalig Internetverbindung).
// ---------------------------------------------------------
let tesseractLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => resolve(window.Tesseract);
    s.onerror = () => reject(new Error("Konnte Texterkennung nicht laden (Internet nötig)"));
    document.head.appendChild(s);
  });
  return tesseractLoading;
}

function setPhotoStatus(idx, text, cls) {
  const el = document.getElementById("photostatus-" + idx);
  el.textContent = text;
  el.className = "photo-status" + (cls ? " " + cls : "");
  el.style.display = text ? "block" : "none";
}

// ---------------------------------------------------------
// Erkennt strukturierte Produktionsdaten aus MES-Screens
// (z. B. TE-Anlagenübersicht): Gruppe (= Anlage/Linie),
// Artikel, Mengen Soll / Gutmenge / Ausschuss.
// Bei Treffer wird daraus eine kompakte Zeile gebaut,
// statt den rohen, unübersichtlichen OCR-Text einzufügen.
// ---------------------------------------------------------
function parseProductionData(rawText) {
  const lines = rawText.replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean);
  const d = {};

  // Anlage = "Gruppe". Bevorzugt bekannte Anlagen-Nummern 801-804 suchen
  // (robuster als Positions-Regex bei mehrspaltigem OCR-Text).
  let m = rawText.match(/\b(80[1-4])\b/);
  if (m) d.gruppe = m[1];

  // --- Artikel ---
  const artikelClean = s => s.trim().replace(/^[:\s-]+/, "").replace(/[.,;:]+$/, "");
  for (let i = 0; i < lines.length; i++) {
    if (/artikel/i.test(lines[i])) {
      let mm = lines[i].match(/artikel[^A-Za-z0-9]{0,5}([A-Za-z0-9][A-Za-z0-9\-.]{2,19})/i);
      if (mm) { d.artikel = artikelClean(mm[1]); break; }
      for (let j = 1; j <= 2 && i + j < lines.length; j++) {
        const cand = lines[i + j];
        if (!cand || /^(mengen|status|gruppe|kurzbezeichnung|arbeitsplatz)/i.test(cand)) continue;
        const mm2 = cand.match(/([A-Za-z0-9]{3,10}[-.]?[A-Za-z0-9]{0,4})/);
        if (mm2) { d.artikel = artikelClean(mm2[1]); break; }
      }
      if (d.artikel) break;
    }
  }

  // --- Mengen (Soll / Gut / Ausschuss) ---
  const numRe = /\d{1,3}(?:\.\d{3})*(?:,\d+)?/g;
  for (let i = 0; i < lines.length; i++) {
    const isLabelLine = /mengen/i.test(lines[i]) ||
      (/soll/i.test(lines[i]) && /ausschuss/i.test(lines[i])) ||
      (/soll/i.test(lines[i]) && /gut/i.test(lines[i]));
    if (isLabelLine) {
      const combined = lines.slice(i, i + 4).join(" ");
      let nums = (combined.match(numRe) || []).filter(n => n.replace(/[.,]/g, "").length >= 2);
      if (nums.length >= 3) {
        d.soll = nums[0]; d.gut = nums[1]; d.ausschuss = nums[2];
        break;
      }
    }
  }

  // Fallback: einzelne beschriftete Felder oben im Screen (Gutmenge / Ausschuss separat)
  if (!d.gut) {
    const gm = rawText.match(/Gutmenge[^\d]{0,10}([\d.,]{2,12})/i);
    if (gm) d.gut = gm[1];
  }
  if (!d.ausschuss) {
    const am = rawText.match(/Ausschuss[^\d]{0,10}([\d.,]{2,12})/i);
    if (am) d.ausschuss = am[1];
  }

  return d;
}

function formatProductionData(d) {
  // Nur als kompakte Zeile verwenden, wenn ALLE relevanten Felder
  // gefunden wurden - sonst lieber den vollständigen Rohtext behalten,
  // damit keine Angaben (Artikel/Mengen) verloren gehen.
  if (d.gruppe && d.artikel && d.soll && d.gut && d.ausschuss) {
    return `Anlage ${d.gruppe}: Artikel ${d.artikel}: Soll ${d.soll} / Gut ${d.gut} / Ausschuss ${d.ausschuss}`;
  }
  return null;
}

async function handlePhotos(idx, fileList) {
  const files = Array.from(fileList);
  const ta = document.getElementById("ta-" + idx);
  let okCount = 0;

  for (let n = 0; n < files.length; n++) {
    setPhotoStatus(idx, `⏳ Bild ${n + 1}/${files.length} wird erkannt …`, "busy");
    try {
      const Tesseract = await loadTesseract();
      const { data: { text } } = await Tesseract.recognize(files[n], "deu");
      const structured = formatProductionData(parseProductionData(text));
      const finalText = structured || correctText(text.trim());
      if (finalText) {
        ta.value = ta.value.trim() ? ta.value.trim() + "\n" + finalText : finalText;
        okCount++;
      }
    } catch (err) {
      setPhotoStatus(idx, "⚠️ " + err.message, "err");
      return;
    }
  }

  ta.classList.remove("flash");
  void ta.offsetWidth;
  ta.classList.add("flash");
  updateProgress();

  if (okCount === 0) {
    setPhotoStatus(idx, "⚠️ Kein Text erkannt. Bitte näher/schärfer fotografieren.", "err");
  } else {
    setPhotoStatus(idx, `✓ ${okCount} von ${files.length} Foto(s) verarbeitet – bitte kurz prüfen. Für weitere Anlagen einfach nochmal „Foto → Text" antippen.`, "ok");
  }
}

container.addEventListener("change", (e) => {
  const input = e.target;
  if (input.tagName === "INPUT" && input.type === "file" && input.id.startsWith("photo-")) {
    const idx = input.id.replace("photo-", "");
    if (input.files && input.files.length) handlePhotos(idx, input.files);
    input.value = ""; // erlaubt erneute Auswahl der gleichen Datei(en)
  }
});

document.getElementById("expandAllBtn").addEventListener("click", () => {
  const secs = document.querySelectorAll(".section");
  const anyClosed = [...secs].some(s => !s.classList.contains("open"));
  secs.forEach(s => s.classList.toggle("open", anyClosed));
});

updateProgress();

// ---------------------------------------------------------
// 4) DRUCKANSICHT VORBEREITEN
//    Überträgt aktuelle Eingaben in eine saubere,
//    reine Textdarstellung (für PDF/Ausdruck).
// ---------------------------------------------------------
function preparePrintView() {
  // Kopf: Datum
  const rawDatum = document.getElementById("datum").value;
  let datum = "—";
  if (rawDatum) {
    const [y, m, d] = rawDatum.split("-");
    datum = `${d}.${m}.${y}`;
  }
  document.getElementById("printMeta").textContent = `Datum: ${datum}`;

  sections.forEach((s, i) => {
    // Textinhalt
    const ta = document.getElementById("ta-" + i);
    const box = document.getElementById("pbox-" + i);
    box.textContent = ta.value.trim() || "— keine Angabe —";

    // Status Ja/Nein (nur bei Prozessparameter-Abschnitt)
    if (s.withStatus) {
      const activeYes = document.querySelector(`.status-toggle button.active-yes[data-idx="${i}"]`);
      const activeNo = document.querySelector(`.status-toggle button.active-no[data-idx="${i}"]`);
      const pstatus = document.getElementById("pstatus-" + i);
      if (activeYes) pstatus.textContent = "Status: Ja";
      else if (activeNo) pstatus.textContent = "Status: Nein";
      else pstatus.textContent = "Status: —";
    }
  });
}

document.getElementById("printBtn").addEventListener("click", () => {
  preparePrintView();
  window.print();
});

// 5) GLOSSAR-PANEL (Fachbegriffe ansehen & ergänzen)
// ---------------------------------------------------------
const glossaryOverlay = document.getElementById("glossaryOverlay");
const customTermsList = document.getElementById("customTermsList");
const builtinTermsList = document.getElementById("builtinTermsList");

function renderGlossaryLists() {
  // Eigene Begriffe
  if (customTerms.length === 0) {
    customTermsList.innerHTML = `<div class="empty-hint">Noch keine eigenen Begriffe hinzugefügt.</div>`;
  } else {
    customTermsList.innerHTML = customTerms.map((t, i) => `
      <div class="glossary-item">
        <div class="txt">${t.correct}${t.wrong ? `<small>statt „${t.wrong}“</small>` : ``}</div>
        <button type="button" data-del="${i}">✕</button>
      </div>
    `).join("");
  }
  // Vordefinierte Begriffe (nur Anzeige)
  builtinTermsList.innerHTML = builtinGlossary
    .filter((v, i, arr) => arr.indexOf(v) === i)
    .sort((a,b) => a.localeCompare(b, "de"))
    .map(t => `<div class="glossary-item"><div class="txt">${t}</div></div>`)
    .join("");
}

document.getElementById("glossaryBtn").addEventListener("click", () => {
  renderGlossaryLists();
  glossaryOverlay.classList.add("open");
});
document.getElementById("glossaryCloseBtn").addEventListener("click", () => {
  glossaryOverlay.classList.remove("open");
});
glossaryOverlay.addEventListener("click", (e) => {
  if (e.target === glossaryOverlay) glossaryOverlay.classList.remove("open");
});

document.getElementById("addTermBtn").addEventListener("click", () => {
  const wrongEl = document.getElementById("newWrong");
  const correctEl = document.getElementById("newCorrect");
  const correct = correctEl.value.trim();
  const wrong = wrongEl.value.trim();
  if (!correct) { correctEl.focus(); return; }
  customTerms.push({ wrong, correct });
  saveCustomTerms();
  wrongEl.value = "";
  correctEl.value = "";
  renderGlossaryLists();
});

customTermsList.addEventListener("click", (e) => {
  const delBtn = e.target.closest("[data-del]");
  if (!delBtn) return;
  const idx = parseInt(delBtn.dataset.del, 10);
  customTerms.splice(idx, 1);
  saveCustomTerms();
  renderGlossaryLists();
});
</script>
